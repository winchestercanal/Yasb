  # --- OBS WIDGET ---
  # Status de gravação do OBS Studio

  obs:
    type: "yasb.obs.ObsWidget"  # Widget de status do OBS Studio
    options:
      connection:  # Configuração de conexão com o OBS WebSocket
        host: "localhost"  # Endereço do OBS
        port: 4455  # Porta do WebSocket (padrão OBS v28+)
        password: "xlbLQQekiEVQLq1X"  # Senha definida no OBS WebSocket

      icons:  # Ícones utilizados para cada estado do OBS
        recording: "\uEBA7"  # Ícone quando está gravando
        stopped: "\uEBA7"  # Ícone quando parado
        paused: "\uEBA7"  # Ícone quando pausado
        virtual_cam_on: "\uDB81\uDDA0"  # Ícone da câmera virtual ativa
        virtual_cam_off: "\uDB81\uDDA0"  # Ícone da câmera virtual desativada
        studio_mode_on: "\uDB84\uDDD8"  # Ícone do modo estúdio ativo
        studio_mode_off: "\uDB84\uDDD8"  # Ícone do modo estúdio desativado
