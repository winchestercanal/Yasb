# - komorebi_control: Controles para iniciar, reiniciar ou parar o Komorebi
# - komorebi_stack: Transfere o controle e visualização de janelas empilhadas (abas) do Komorebi para a barra
# - komorebi_workspaces: Exibe e permite alternar os espaços de trabalho do Komorebi
# - language: Indicador de idioma/layout do teclado
# - launchpad: Lançador de aplicativos com lista de atalhos
# - libre_gpu: Monitora os sensores da GPU via LibreHardwareMonitor
# - libre_monitor_widget: Monitora sensores de hardware configuráveis via LibreHardwareMonitor
# - media: Controle de reprodução de mídia (Spotify, YouTube, etc)
# - media_lite: Controle de reprodução de mídia com miniatura da capa e menu de mídia
# - memory: Monitor de uso de memória RAM
# - microphone: Status e controle do microfone
# - notes: Notas rápidas persistentes
# - notifications: Central de notificações do Windows
# - obs: Status de gravação do OBS Studio
# - open_meteo: Previsão do tempo usando a API Open-Meteo (sem necessidade de chave de API)
# - pomodoro: Temporizador de foco e pausas com a técnica Pomodoro
# - power_menu: Menu de opções de energia (desligar, reiniciar, etc) em tela cheia
# - power_plan: Mostra e altera o plano de energia do Windows
# - quick_launch: Busca rápida de aplicativos, arquivos, cálculos, área de transferência e outros provedores
# - recycle_bin: Monitor da lixeira do Windows
# - server_monitor: Monitor de status de servidores/sites
# - systray: Bandeja do sistema com ícones de aplicativos
# - taskbar: Barra de tarefas com janelas abertas
# - todo: Lista persistente de tarefas com itens pendentes e concluídos
# - toggle_theme: Alterna entre os temas claro e escuro usando o script configurado
# - traffic: Monitor de tráfego de rede com velocidades de download e upload
# - update_check: Verificador de atualizações (Windows Update e Winget)
# - volume: Controle de volume do sistema e por aplicativo
# - vscode: Abre pastas e arquivos recentes do Visual Studio Code; requer o editor e seu comando no PATH
# - wallpapers: Gerenciador de papéis de parede com galeria
# - weather: Previsão do tempo com card detalhado
# - whkd: Widget para mostrar atalhos de teclado do Komorebi (WHKD)
# - wifi: Status e controle de conexão WiFi
# - win_button: Botão do menu iniciar do Windows
# - window_controls: Controle de janelas ativas (Minimizar / Maximizar / Fechar)
# - window_switcher: Widget para alternar entre janelas abertas
# - windows_workspaces: Desktops virtuais nativos do Windows
