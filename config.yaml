        blur: true
        round_corners: true
        round_corners_type: "small"
        border_color: "System"
        alignment: "right"
        direction: "down"
        offset_top: 6  # Deslocamento vertical em pixels
        offset_left: 0  # Deslocamento horizontal em pixels
      callbacks:
        on_left: "toggle_group" # Exibe o menu de discos
        on_middle: "toggle_label" # Alterna rótulo
        on_right: "exec explorer C:\\"  # Abre o Explorer na unidade C:
      disk_thresholds:
        low: 25
        medium: 50
        high: 90
      class_name: ""  # Classe CSS adicional para personalizar este widget
      decimal_display: 1  # Quantidade de casas decimais
      progress_bar:  # Aparência e comportamento do indicador de progresso
        enabled: false  # Ativa ou desativa este recurso
        progress_type: "circular"  # Tipo: circular, linear_horizontal ou linear_vertical
        size: 18  # Tamanho em pixels
        thickness: 3  # Espessura em pixels
        radius: 0  # Raio dos cantos em pixels
        color: "#00C800"  # Cor principal; aceita hexadecimal
        background_color: "#3C3C3C"  # Cor de fundo
        position: "left"  # Posição do elemento
        animation: true  # Animação das mudanças do indicador
      keybindings: []  # Atalhos globais opcionais; formato: [{keys: "ctrl+alt+x", action: "toggle_label"}]

  # --- DISK GROUP WIDGET ---
  # Versão agrupada do disk widget
  disk_group:
    type: "yasb.disk.DiskWidget"
    options:
      label: "<span>\uF473</span>"
      label_alt: "<span>\uF473</span>"
      group_label:
        volume_labels: ["C", "D", "E", "F"]
        show_label_name: true
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "System"
        alignment: "right"
        direction: "down"
        offset_top: 6  # Deslocamento vertical em pixels
        offset_left: 0  # Deslocamento horizontal em pixels
      callbacks:
        on_left: "toggle_group"
        on_middle: "do_nothing"  # Clique do meio
        on_right: "do_nothing"  # Clique direito
      class_name: ""  # Classe CSS adicional para personalizar este widget
      volume_label: "C"  # Rótulo da unidade de disco
      update_interval: 60  # Intervalo entre atualizações; consulte a unidade na documentação do widget
      decimal_display: 1  # Quantidade de casas decimais
      disk_thresholds:  # Limites de ocupação do disco
        low: 25  # Limite ou ícone do estado baixo
        medium: 50  # Limite ou ícone do estado médio
        high: 90  # Limite ou ícone do estado alto
      progress_bar:  # Aparência e comportamento do indicador de progresso
        enabled: false  # Ativa ou desativa este recurso
        progress_type: "circular"  # Tipo: circular, linear_horizontal ou linear_vertical
        size: 18  # Tamanho em pixels
        thickness: 3  # Espessura em pixels
        radius: 0  # Raio dos cantos em pixels
        color: "#00C800"  # Cor principal; aceita hexadecimal
        background_color: "#3C3C3C"  # Cor de fundo
        position: "left"  # Posição do elemento
        animation: true  # Animação das mudanças do indicador
      keybindings: []  # Atalhos globais opcionais; formato: [{keys: "ctrl+alt+x", action: "toggle_label"}]

# --- Do Not Disturb WIDGET ---
  dnd:
    type: "yasb.dnd.DndWidget"
    options:
      label: "{icon}"
      label_alt: "{icon} {status}"
      default_active_mode: "priority"
      callbacks:
        on_left: "toggle_status"
        on_right: "cycle_status"
        on_middle: "do_nothing"  # Clique do meio
      icons:
        disabled: "\uf0f3" # If you are looking for Segoe Fluent Icons, Windows 11 uses \uf285 for all states
        priority: "\uf186" 
        alarms: "\uf1f6" 
      class_name: ""  # Classe CSS adicional para personalizar este widget
      tooltip: true  # Informação exibida ao passar o mouse

  # --- GITHUB WIDGET ---
  # Notificações do GitHub
  github:
    type: "yasb.github.GithubWidget"
    options:
      label: "<span>\uEBA1</span>"
      label_alt: "Notifications {data}"  # {data} = número de notificações não lidas
      token: ghp_xxxxxxxxxxx  # Token de acesso pessoal do GitHub
      # token: env  # Alternativa: usar variável de ambiente YASB_GITHUB_TOKEN
      max_notification: 30    # Máximo de notificações no menu (limite: 50)
      notification_dot:
        enabled: true
        corner: "bottom_left"  # Posição do indicador
        color: "red"
        margin: [1, 1]
      only_unread: false      # true = apenas não lidas
      show_comment_count: false  # Mostra total de comentários
      reason_filters: []      # Filtrar por motivo: ['mention', 'assign', 'review_requested']
      max_field_size: 54      # Tamanho máximo do título
      update_interval: 300    # Verificação em segundos
      menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "System"
        alignment: "right"
        direction: "down"
        show_categories: false  # Agrupa por tipo
        categories_order: ["PullRequest", "Issue", "CheckSuite", "Release", "Discussion"]
        offset_top: 6  # Deslocamento vertical em pixels
        offset_left: 0  # Deslocamento horizontal em pixels
      tooltip: true  # Informação exibida ao passar o mouse
      hide_empty: false  # Oculta o widget quando não há conteúdo
      icons:  # Ícones usados pelos estados e controles
        issue: "\uf41b"  # Ajuste de problema
        issue_closed: "\uf41d"  # Ajuste de problema fechado
        pull_request: "\uea64"  # Ajuste de integração solicitação
        pull_request_closed: "\uebda"  # Ajuste de integração solicitação fechado
        pull_request_merged: "\uf17f"  # Ajuste de integração solicitação integrado
        pull_request_draft: "\uebdb"  # Ajuste de integração solicitação rascunho
        release: "\uea84"  # Ajuste de versão
        discussion: "\uf442"  # Ajuste de discussão
        discussion_answered: "\uf4c0"  # Ajuste de discussão respondida
        checksuite: "\uf418"  # Ícone de verificações automatizadas
        default: "\uea84"  # Ajuste de padrão
        github_logo: "\uea84"  # Ícone do GitHub
        comment: "\uf41f"  # Ajuste de comentário
      keybindings: []  # Atalhos globais opcionais; formato: [{keys: "ctrl+alt+x", action: "toggle_label"}]

  # --- GLAZEWM GROUPER ---
  # Agrupa widgets relacionados ao GlazeWM
  # Útil para organizar workspace + modo + janela ativa
  glazewm-grouper:
    type: "yasb.grouper.GrouperWidget"
    options:
      class_name: "glazewm-grouper"  # Nome da classe CSS
      widgets: ["glazewm_workspaces", "glazewm_binding_mode", "active_window" # Título da janela ativa
]
      collapse_options:
        enabled: false  # true = permite colapsar o grupo
        exclude_widgets: []  # Widgets que continuam visíveis quando o grupo está recolhido
        expanded_label: "\uf054"  # Ícone do grupo expandido
        collapsed_label: "\uf053"  # Ícone do grupo recolhido
        label_position: "right"  # Posição do botão: left ou right
      hide_empty: false  # Oculta o widget quando não há conteúdo
      keybindings: []  # Atalhos globais opcionais; formato: [{keys: "ctrl+alt+x", action: "toggle_label"}]
        # Se enabled: true, configure:
        # exclude_widgets: ["glazewm_workspaces"]  # Widgets que não colapsam
        # expanded_label: "\uf054"    # Ícone expandido
        # collapsed_label: "\uf053"   # Ícone colapsado
        # label_position: "right"     # Posição: "left", "right"

  # --- GLAZEWM WIDGETS ---
  # Widgets para o gerenciador de janelas GlazeWM
  # GlazeWM é um gerenciador de janelas tiling alternativo para Windows
  # Funciona de forma similar ao Komorebi para Windows ou ao i3wm/Sway do Linux
  # Download: https://github.com/glzr-io/glazewm

  # --- GLAZEWM BINDING MODE WIDGET ---
  # Mostra o modo de binding ativo (normal, resize, pause, etc)
  # Útil para saber qual conjunto de atalhos está ativo
  glazewm_binding_mode:
    type: "glazewm.binding_mode.GlazewmBindingModeWidget"
    options:
      hide_if_no_active: false  # Oculta widget quando nenhum modo está ativo
      label_if_no_active: "No binding mode active"  # Texto quando nenhum modo ativo
      default_icon: "\uF071"  # Ícone padrão para modos não mapeados
      # Ícones personalizados para cada modo de binding
      icons:
        resize: "\uF071"      # Modo de redimensionamento
        pause: "\uF28C"       # Modo pausado (tiling desativado)
        # Adicione mais modos conforme sua config do GlazeWM:
        # move: "\uf0b2"
        # focus: "\uf192"
      # Modos disponíveis para alternar com callback
      binding_modes_to_cycle_through: ["none", "resize", "pause"]
      # Ações de clique
      callbacks:
        on_left: "next_binding_mode"      # Cicla para próximo modo
        on_middle: "toggle_label"         # Alterna exibição
        on_right: "disable_binding_mode"  # Desativa modo atual (volta ao normal)
      label: "<span>{icon}</span> {binding_mode}"  # Texto principal; aceita as variáveis do widget
      label_alt: "<span>{icon}</span> Current mode: {binding_mode}"  # Texto alternativo ao alternar o rótulo
      glazewm_server_uri: "ws://localhost:6123"  # Endereço do servidor WebSocket do GlazeWM
      keybindings: []  # Atalhos globais opcionais; formato: [{keys: "ctrl+alt+x", action: "toggle_label"}]

  # --- GLAZEWM TILING DIRECTION WIDGET ---
  # Mostra e altera a direção do tiling (horizontal/vertical)
  # Controla como novas janelas serão divididas
  glazewm_tiling_direction:
    type: "glazewm.tiling_direction.GlazewmTilingDirectionWidget"
    options:
      horizontal_label: "\uDB81\uDCE1"  # Ícone para tiling horizontal
      vertical_label: "\uDB81\uDCE2"    # Ícone para tiling vertical
      glazewm_server_uri: "ws://localhost:6123"  # Endereço do servidor WebSocket do GlazeWM
      # Callback padrão ao clicar: alterna entre horizontal/vertical
      # callbacks:
      #   on_left: "toggle_direction"
      #   on_right: "do_nothing"

  # --- GLAZEWM WORKSPACES WIDGET ---
  # Lista de workspaces (espaços de trabalho) do GlazeWM
  # Similar aos desktops virtuais, mas com tiling
  glazewm_workspaces:
    type: "glazewm.workspaces.GlazewmWorkspacesWidget"
    options:
      offline_label: "GlazeWM Offline"  # Texto quando GlazeWM não está rodando
      hide_if_offline: false            # Oculta widget se GlazeWM offline
      enable_scroll_switching: true     # Alterna workspace com scroll do mouse
      # Ícones de aplicativos nas workspaces
      app_icons:
        enabled_populated: false  # Mostra ícones em workspaces com janelas
        enabled_active: false     # Mostra ícones apenas na workspace ativa
        size: 16                  # Tamanho dos ícones
        max_icons: 0             # Máximo de ícones (0 = ilimitado)
        hide_label: false        # Oculta label do workspace
        hide_duplicates: false   # Oculta ícones duplicados
        hide_floating: false     # Oculta ícones de janelas flutuantes
        enabled_focused: null  # Exibe os ícones no espaço em foco
      populated_label: null  # Rótulo do espaço de trabalho ocupado
      empty_label: null  # Rótulo do espaço de trabalho vazio
      active_populated_label: null  # Rótulo do espaço ativo e ocupado
      active_empty_label: null  # Rótulo do espaço ativo e vazio
      focused_populated_label: null  # Rótulo do espaço em foco e ocupado
      focused_empty_label: null  # Rótulo do espaço em foco e vazio
      monitor_exclusive: true  # Exibe somente os dados do monitor atual
      glazewm_server_uri: "ws://localhost:6123"  # Endereço do servidor WebSocket do GlazeWM
      reverse_scroll_direction: false  # Inverte a navegação pela roda do mouse

  # --- GLUCOSE MONITOR WIDGET ---
  # Mostra dados de um servidor Nightscout. Configure host e a variável YASB_CGM_SECRET antes de ativar.
  # Para exibir, adicione "glucose_monitor" a uma lista left, center ou right da barra.
  glucose_monitor:
    type: "yasb.glucose_monitor.GlucoseMonitor"
    options:
      label: "<span>\ud83e\ude78</span><span class='sgv'>{sgv}</span><span>{direction}</span>"  # Texto principal; aceita as variáveis do widget
      error_label: "<span>\ud83e\ude78</span>{error_message}"  # Texto exibido quando ocorre um erro
      tooltip: "({sgv_delta}) {delta_time_in_minutes} min"  # Informação exibida ao passar o mouse
      host: ""  # Endereço do seu servidor Nightscout; configure antes de ativar
      secret: "env"  # Use env para ler a chave do Nightscout de uma variável de ambiente
      secret_env_name: "YASB_CGM_SECRET"  # Nome da variável de ambiente que contém a chave do Nightscout
      direction_icons:  # Ícones de tendência da glicose
        double_up: "\u2b06\ufe0f\u2b06\ufe0f"  # Ícone de subida rápida
        single_up: "\u2b06\ufe0f"  # Ícone de subida
        forty_five_up: "\u2197\ufe0f"  # Ícone de subida gradual
        flat: "\u27a1\ufe0f"  # Ícone de tendência estável
        forty_five_down: "\u2198\ufe0f"  # Ícone de descida gradual
        single_down: "\u2b07\ufe0f"  # Ícone de descida
        double_down: "\u2b07\ufe0f\u2b07\ufe0f"  # Ícone de descida rápida
      sgv_measurement_units: "mmol/l"  # Unidade de glicose: mg/dl ou mmol/l
      callbacks:  # Ações ao clicar com os botões do mouse
        on_left: "open_cgm"  # Clique esquerdo
        on_middle: "do_nothing"  # Clique do meio
        on_right: "do_nothing"  # Clique direito
      notify_on_error: false  # Envia uma notificação quando ocorre um erro
      sgv_range:  # Faixa visual de referência; ajuste conforme sua configuração pessoal
        min: 4.0  # Valor mínimo
        max: 9.0  # Valor máximo
      keybindings: []  # Atalhos globais opcionais; formato: [{keys: "ctrl+alt+x", action: "toggle_label"}]

  # --- GPU WIDGET ---
  # Monitor de uso da GPU (NVIDIA/AMD)
  gpu:
    type: "yasb.gpu.GpuWidget"
    options:
      label: "<span>\uF4BC</span> {info[temp]}\xB0C | <span>\uF4BC</span> {info[utilization]}%"
      label_alt: "<span>\uF4BC</span> {info[temp]}\xB0C | {info[mem_used]} / {info[mem_total]}"
      update_interval: 2000
      gpu_thresholds:
        low: 25
        medium: 50
        high: 90
      histogram_icons:
        - "\u2581" # 0%
        - "\u2581" # 10%
        - "\u2582" # 20%
        - "\u2583" # 30%
        - "\u2584" # 40%
        - "\u2585" # 50%
        - "\u2586" # 60%
        - "\u2587" # 70%
        - "\u2588" # 80%+
      histogram_num_columns: 8
      callbacks:
        on_left: "toggle_menu" # Exibe menu com detalhes da GPU
        on_right: "toggle_label" # Alterna entre label principal e alternativo
        on_middle: "do_nothing"  # Clique do meio
      menu:
        enabled: true
        alignment: "center"
        show_graph: true
        show_graph_grid: true
        graph_history_size: 60
        blur: true  # Ativa o efeito de desfoque
        round_corners: true  # Arredonda os cantos da janela
        round_corners_type: "normal"  # Tipo de arredondamento: normal ou small
        border_color: "System"  # Cor da borda: System, None ou uma cor hexadecimal
        direction: "down"  # Direção de abertura: up ou down
        offset_top: 6  # Deslocamento vertical em pixels
        offset_left: 0  # Deslocamento horizontal em pixels
        pin_icon: "\ue718"  # Ícone para fixar a janela
        unpin_icon: "\ue77a"  # Ícone para desafixar a janela
      gpu_index: 0  # Índice da GPU monitorada, começando em 0
      class_name: ""  # Classe CSS adicional para personalizar este widget
      hide_decimal: false  # Oculta as casas decimais
      units: "metric"  # Sistema de unidades exibidas
      progress_bar:  # Aparência e comportamento do indicador de progresso
        enabled: false  # Ativa ou desativa este recurso
        progress_type: "circular"  # Tipo: circular, linear_horizontal ou linear_vertical
        size: 18  # Tamanho em pixels
        thickness: 3  # Espessura em pixels
        radius: 0  # Raio dos cantos em pixels
        color: "#00C800"  # Cor principal; aceita hexadecimal
        background_color: "#3C3C3C"  # Cor de fundo
        position: "left"  # Posição do elemento
        animation: true  # Animação das mudanças do indicador
      keybindings: []  # Atalhos globais opcionais; formato: [{keys: "ctrl+alt+x", action: "toggle_label"}]

  # --- GROUPER WIDGET ---
  # Agrupa múltiplos widgets com opção de colapsar
  grouper:
    type: "yasb.grouper.GrouperWidget"
    options:
      class_name: "systeminfo-grouper"
      widgets: ["cpu", "memory", "gpu"]
      collapse_options:
        enabled: true
        exclude_widgets: ["cpu"]      # Widgets que não serão colapsados
        expanded_label: "\uF054"      # Ícone expandido
        collapsed_label: "\uF053"     # Ícone colapsado
        label_position: "right"       # Posição: "left", "right"
      hide_empty: false  # Oculta o widget quando não há conteúdo
      keybindings: []  # Atalhos globais opcionais; formato: [{keys: "ctrl+alt+x", action: "toggle_label"}]

  # --- HOME WIDGET ---
  # Menu de início com atalhos para pastas e opções do sistema
  home:
    type: "yasb.home.HomeWidget"
    options:
      # --- LABEL DO WIDGET ---
      label: "<span>\ue700</span>"  # Ícone de menu hambúrguer (Segoe Fluent Icons / Segoe MDL2 Assets)
      # Outros ícones sugeridos:
      # "\uf015" - Casa (FontAwesome)
      # "\uf07c" - Pasta
      # "\uf0c9" - Menu hambúrguer
      # "\ue5d2" - Home (Material)
      # --- LISTA DE ATALHOS PERSONALIZADOS ---
      # Cada entrada cria um item no menu
      menu_list:
        # Formato: { title: "Nome", path: "Caminho" }
        # ATALHO PARA PASTA DO USUÁRIO
        - {title: "Usu\xE1rio", path: "~"}
        # ATALHOS PARA PASTAS ESPECÍFICAS, substitua a variavel PATH pelo endereço de seus diretórios (geralmente exige barras duplas '\\' ao invés das barras simples tradicionais '\')
        # exemplo para o path: "C:\\Users\\Username\\Downloads"
        - {title: "Downloads", path: "$env:Downloads"}
        - {title: "Documentos", path: "$env:Documentos"}
        - {title: "Backups", path: "$env:Backups"}
        - {title: "OBS", path: "$env:OBS"}
        - {title: "StockFootage", path: "$env:StockFootage"}
        # ATALHOS PARA PASTAS DE SISTEMA
        - {title: "Desktop", path: "%USERPROFILE%\\Desktop"}
        - {title: "AppData", path: "%APPDATA%"}
        - {title: "Temp", path: "%TEMP%"}
        - {title: "Program Files", path: "C:\\Program Files"}
        # ATALHOS PARA LOCAIS DE REDE
        # - { title: "Servidor", path: "\\\\192.168.1.100\\share" }
        # - { title: "NAS", path: "\\\\NAS\\Documents" }   
      # --- OPÇÕES DE MENU DE SISTEMA ---
      system_menu: true  # Mostra opções de sistema no final do menu
      # Quando true, adiciona:
      # - Configurações (Settings)
      # - Sobre o Windows (About)
      # - Gerenciador de Tarefas (Task Manager)
      power_menu: true   # Mostra opções de energia no final do menu
      # Quando true, adiciona:
      # - Desligar (Shutdown)
      # - Reiniciar (Restart)
      # - Sair (Logout)  
      # --- ESTILO DO MENU DROPDOWN ---
      blur: true              # Efeito de desfoque no fundo (Windows 11)
      round_corners: true     # Cantos arredondados (Windows 11)
      round_corners_type: "normal"  # Tipos: "normal", "small"
      border_color: "System"  # Opções: "System", "None", ou cor HEX "#RRGGBB"
      # --- POSICIONAMENTO DO MENU ---
      offset_top: 6    # Distância da barra em pixels (vertical)
      offset_left: 0   # Deslocamento horizontal em pixels
      alignment: "left"  # Alinhamento: "left", "center", "right"
      direction: "down"  # Direção: "down" (para baixo), "up" (para cima)
      # --- PERSONALIZAÇÃO DE LABELS ---
      # Altere os textos/nomes das opções de energia e sistema
      menu_labels:
        # OPÇÕES DE ENERGIA
        shutdown: "Desligar"           # Texto do botão desligar
        restart: "Reiniciar"           # Texto do botão reiniciar
        logout: "Sair"                 # Texto do botão sair
        sleep: "Suspender"             # Texto do botão suspender
        hibernate: "Hibernar"          # Texto do botão hibernar
        # OPÇÕES DE SISTEMA
        system: "Configura\xE7\xF5es"  # Texto das configurações
        about: "Sobre o PC"                 # Texto do sobre
        task_manager: "Gerenciador"    # Texto do gerenciador de tarefas
        lock: "Lock"  # Botão de bloqueio da sessão
      keybindings: []  # Atalhos globais opcionais; formato: [{keys: "ctrl+alt+x", action: "toggle_label"}]
      callbacks:  # Ações ao clicar com os botões do mouse
        on_left: "toggle_menu"  # Clique esquerdo
        on_middle: "do_nothing"  # Clique do meio
        on_right: "do_nothing"  # Clique direito

  # --- IP INFO WIDGET ---
  # Mostra informações de IP e localização via API
  ip_info:
    type: "yasb.custom.CustomWidget"
    options:
      # Variáveis: {data[ip]}, {data[city]}, {data[region]}, {data[country]}
      label: "<span>\uDB81\uDD9F</span> {data[ip]}"
      label_alt: "<span>\uF450</span> {data[city]} {data[region]}, {data[country]}"
      class_name: "ip-info-widget"
      tooltip: true
      tooltip_label: "IP: {data[ip]}\nCity: {data[city]}\nRegion: {data[region]}\nCountry: {data[country]}"
      exec_options:
        run_cmd: "curl.exe https://ipinfo.io"  # Comando para obter dados
        run_interval: 120000  # Atualização a cada 2 minutos
        return_format: "json"  # Formato: "json", "string"
        hide_empty: false
        run_once: false  # Executa o comando uma única vez
        use_shell: true  # Executa o comando por meio do interpretador do sistema
        encoding: null  # Codificação usada para ler a saída do comando
      callbacks:
        on_left: "toggle_label"
        on_middle: "exec cmd /c ncpa.cpl"  # Abre configurações de rede
        on_right: "exec cmd /c start https://ipinfo.io/{data[ip]}"  # Abre no navegador
      label_placeholder: "Loading..."  # Texto exibido enquanto os dados são carregados
      label_max_length: null  # Limite de caracteres do rótulo
      keybindings: []  # Atalhos globais opcionais; formato: [{keys: "ctrl+alt+x", action: "toggle_label"}]
  

  # --- KOMOREBI ACTIVE LAYOUT ---
  # Exibe e controla o layout ativo do Komorebi
  komorebi_active_layout:
    type: "komorebi.active_layout.ActiveLayoutWidget"
    options:
      hide_if_offline: true
      label: "{icon} {layout_name}"
      layouts: ['bsp', 'columns', 'rows', 'grid', 'scrolling', 'vertical_stack', 'horizontal_stack', 'ultrawide_vertical_stack',
        'right_main_vertical_stack']
      layout_icons:  # Ícones para cada tipo de layout
        bsp: "\uEBEB"
        columns: "\uEBF7"
        rows: "\uEC01"
        grid: "\uDB81\uDF58"
        scrolling: "\uEBF7"
        vertical_stack: "\uEBEE"
        horizontal_stack: "\uEBF0"
        ultrawide_vertical_stack: "\uEBEE"
        right_main_vertical_stack: "\uEBF1"
        monocle: "\uF06F"
        maximized: "\uF06F"
        floating: "\uF2D2"
        paused: "\uDB83\uDF89"
        tiling: "\uDB81\uDE40"
      callbacks:
        on_left: 'toggle_layout_menu'
        on_middle: 'prev_layout'
        on_right: 'next_layout'
      layout_menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "System"
        alignment: "center"
        direction: "down"
        offset_top: 6
        offset_left: 0
        show_layout_icons: true
      keybindings: []  # Atalhos globais opcionais; formato: [{keys: "ctrl+alt+x", action: "toggle_label"}]

  # --- KOMOREBI CONTROL ---
  # Controles para iniciar, reiniciar ou parar o Komorebi
  komorebi_control:
    type: "komorebi.control.KomorebiControlWidget"
    options:
      label: "<span>\uDB80\uDDD9</span>"
      icons:
        start: "\uEAD3"
        stop: "\uEAD7"
        reload: "\uEAD2"
      run_ahk: false      # Executar AutoHotkey junto ao Komorebi
      run_whkd: true      # Executar WHKD (hotkey daemon) junto ao Komorebi
      run_masir: false    # Executar Masir junto ao Komorebi
      show_version: true
      komorebi_menu:
        blur: true
        round_corners: true
        round_corners_type: 'normal'
        border_color: 'System'
        alignment: "center"
        direction: 'down'
        offset_top: 6
        offset_left: 0
      config_path: null  # Caminho da configuração do Komorebi; vazio usa o padrão
      keybindings: []  # Atalhos globais opcionais; formato: [{keys: "ctrl+alt+x", action: "toggle_label"}]
      callbacks:  # Ações ao clicar com os botões do mouse
        on_left: "toggle_menu"  # Clique esquerdo
        on_middle: "do_nothing"  # Clique do meio
        on_right: "do_nothing"  # Clique direito

  # --- KOMOREBI STACK ---
  # Transfere o controle e visualização de janelas empilhadas (abas) do Komorebi para a barra
  komorebi_stack:
    type: "komorebi.stack.StackWidget"
    options:
      label_offline: "Offline"
      label_window: "{process}"
      label_window_active: "{title}"
      label_no_window: "No Window"
      label_zero_index: false
      show_icons: "always"  # Opções: "always", "never", "active"
      icon_size: 14
      max_length: 10
      max_length_active: 20
      max_length_ellipsis: ".."
      hide_if_offline: true
      show_only_stack: true
      rewrite:  # Regras de reescrita de nomes
        - pattern: "^(.+?)\\.exe$"
          replacement: "\\1"
          case: "lower"  # "lower", "upper", "title"
      enable_scroll_switching: true
      max_length_overall: null  # Limite total de caracteres do grupo
      reverse_scroll_direction: false  # Inverte a navegação pela roda do mouse

  # --- KOMOREBI WORKSPACES ---
  # Exibe e controla as workspaces do Komorebi
  komorebi_workspaces:
    type: "komorebi.workspaces.WorkspaceWidget"
    options:
      label_offline: "Komorebi Offline"
      label_workspace_btn: "\uDB81\uDC3D"           # Ícone workspace vazio
      label_workspace_active_btn: "\uDB81\uDC3E"    # Ícone workspace ativo
      label_workspace_populated_btn: "\uDB81\uDC3E" # Ícone workspace com janelas
      label_zero_index: false  # true = começa do 0, false = começa do 1
      hide_empty_workspaces: false # Oculta workspaces sem janelas
      hide_if_offline: false
      toggle_workspace_layer:
