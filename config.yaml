        show_context_menu: "Shift+F10"  # Exibe o menu de contexto
        delete_app: "Delete"  # Ajuste de excluir aplicativo
      keybindings: []  # Atalhos globais opcionais; formato: [{keys: "ctrl+alt+x", action: "toggle_label"}]

  # --- LIBRE HARDWARE MONITOR WIDGETS ---
  # Monitores avançados de hardware via LibreHardwareMonitor
  # REQUER: LibreHardwareMonitor rodando com servidor web ativo

  libre_gpu:
    type: "yasb.libre_monitor.LibreHardwareMonitorWidget"
    options:
      # Variáveis: {info[value]}, {info[unit]}, {info[min]}, {info[max]}, {info[histogram]}
      label: "<span>\uDB82\uDCAE </span> {info[value]}{info[unit]}"
      label_alt: "<span>\uF437 </span>{info[histogram]} {info[value]} ({info[min]}/{info[max]}) {info[unit]}"
      sensor_id: "/gpu-nvidia/0/temperature/0"  # ID do sensor (veja data.json do Libre)
      update_interval: 1000
      precision: 2  # Casas decimais
      histogram_num_columns: 10
      class_name: "libre-monitor-widget"
      history_size: 60  # Tamanho do histórico para min/max
      histogram_icons:
        - "\u2581" # 0%
        - "\u2581" # 10%
        - "\u2581" # 20%
        - "\u2581" # 30%
        - "\u2581" # 40%
        - "\u2581" # 50%
        - "\u2581" # 60%
        - "\u2581" # 70%
        - "\u2581" # 80%+
      # histogram_fixed_min: 0.0   # Min/max fixos para o histograma
      # histogram_fixed_max: 100.0
      server_host: "192.168.227.1"  # IP do servidor LibreHardwareMonitor
      server_port: 8085             # Porta padrão: 8085
      # server_username: "admin"    # Se tiver autenticação
      # server_password: "password"
      callbacks:
        on_left: "toggle_label"
        on_middle: "do_nothing"
        on_right: "toggle_menu"
      libre_menu:  # Menu com múltiplos sensores
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "System"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0
        header_label: "YASB Hardware Monitor"
        precision: 1
        columns: 1  # Número de colunas no menu
        sensors:  # Lista de sensores para o menu
          - id: "/intelcpu/0/temperature/8"
            name: "CPU Temp"
          - id: "/intelcpu/0/load/0"
            name: "CPU Load"
          - id: "/intelcpu/0/power/0"
            name: "CPU Package Power"
          - id: "/intelcpu/0/power/1"
            name: "CPU Core Power"
          - id: "/gpu-nvidia/0/temperature/0"
            name: "Nvidia Temp"
          - id: "/lpc/it8689e/0/fan/0"
            name: "CPU Fan"
          - id: "/lpc/it8689e/0/fan/1"
            name: "System Fan"
      histogram_fixed_min: null  # Limite inferior fixo do histórico; null usa escala automática
      histogram_fixed_max: null  # Limite superior fixo do histórico; null usa escala automática
      sensor_id_error_label: "N/A"  # Texto exibido quando o sensor não é encontrado
      connection_error_label: "Connection error..."  # Texto exibido quando a conexão falha
      auth_error_label: "Auth Failed..."  # Texto exibido quando a autenticação falha
      server_username: ""  # Usuário do servidor; vazio quando não há autenticação
      server_password: ""  # Senha do servidor; vazio quando não há autenticação
      keybindings: []  # Atalhos globais opcionais; formato: [{keys: "ctrl+alt+x", action: "toggle_label"}]

  libre_monitor_widget:
    type: "yasb.libre_monitor.LibreHardwareMonitorWidget"
    options:
      label: "<span>\uF4BC</span> {info[value]}{info[unit]}"
      label_alt: "<span>\uF437 </span>{info[histogram]} {info[value]} ({info[min]}/{info[max]}) {info[unit]}"
      sensor_id: "/intelcpu/0/load/0"  # Exemplo: carga da CPU
      update_interval: 1000
      precision: 0
      histogram_num_columns: 10
      class_name: "libre-monitor-widget"
      # Como encontrar sensor_id:
      # 1. Inicie LibreHardwareMonitor
      # 2. Ative o servidor web nas opções
      # 3. Acesse http://localhost:8085/data.json
      # 4. Procure o sensor desejado e copie o "SensorId"
      callbacks:
        on_left: "toggle_menu"
        on_middle: "do_nothing"
        on_right: "toggle_label"
      libre_menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "System"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0
        header_label: "YASB Hardware Monitor"
        precision: 1
        columns: 1
        sensors:
          - id: "/intelcpu/0/load/0"
            name: "CPU Load"
          - id: "/intelcpu/0/temperature/8"
            name: "CPU Temp"
          - id: "/intelcpu/0/power/0"
            name: "CPU Package Power"
          - id: "/intelcpu/0/power/1"
            name: "CPU Core Power"
          - id: "/gpu-nvidia/0/temperature/0"
            name: "Nvidia Temp"
          - id: "/ram/data/1"
            name: "Ram"
      history_size: 60  # Quantidade de amostras mantidas no histórico
      histogram_fixed_min: null  # Limite inferior fixo do histórico; null usa escala automática
      histogram_fixed_max: null  # Limite superior fixo do histórico; null usa escala automática
      sensor_id_error_label: "N/A"  # Texto exibido quando o sensor não é encontrado
      connection_error_label: "Connection error..."  # Texto exibido quando a conexão falha
      auth_error_label: "Auth Failed..."  # Texto exibido quando a autenticação falha
      server_host: "localhost"  # Endereço do servidor de sensores
      server_port: 8085  # Porta do servidor de sensores
      server_username: ""  # Usuário do servidor; vazio quando não há autenticação
      server_password: ""  # Senha do servidor; vazio quando não há autenticação
      keybindings: []  # Atalhos globais opcionais; formato: [{keys: "ctrl+alt+x", action: "toggle_label"}]

  # --- MEDIA WIDGET ---
  # Controle de reprodução de mídia (Spotify, YouTube, etc)
  media:
    type: "yasb.media.MediaWidget"
    options:
      # Variáveis: {title}, {artist}, {album}, {s} (separador)
      label: "{title}{s}{artist}"
      label_alt: "{title}"
      separator: " - "
      hide_empty: true  # Oculta quando nada está tocando
      callbacks:
        on_left: "toggle_media_menu"
        on_middle: "toggle_label"
