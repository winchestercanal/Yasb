      max_field_size:  # Tamanho máximo dos campos
        label: 20
        label_alt: 30
        truncate_whole_label: true  # Abrevia o rótulo completo em vez de cada campo
      show_thumbnail: true      # Mostra capa do álbum
      controls_only: false      # Mostra apenas controles
      controls_left: true       # Controles à esquerda
      controls_hide: false      # Oculta controles
      thumbnail_alpha: 80       # Opacidade da thumbnail (0-100)
      thumbnail_padding: 8      # Espaçamento da thumbnail
      thumbnail_corner_radius: 16
      icons:
        prev_track: "\uE892"
        next_track: "\uE893"
        play: "\uE768"
        pause: "\uE769"
      media_menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "center"
        direction: "down"
        offset_top: 6
        offset_left: 0
        thumbnail_corner_radius: 8
        thumbnail_size: 120
        max_title_size: 60
        max_artist_size: 20
        show_source: true         # Mostra origem (Spotify, YouTube)
        show_volume_slider: false # Controle de volume por app
        max_source_size: 16  # Limite de caracteres do nome da origem da mídia
      media_menu_icons:
        play: "\uE768"
        pause: "\uE769"
        prev_track: "\uE892"
        next_track: "\uE893"
        mute: "\uE994"
        unmute: "\uE74F"
      scrolling_label:  # Label animado para textos longos
        enabled: false
        update_interval_ms: 33
        style: "left"  # Estilos: "left", "right", "bounce", "bounce-ease"
        separator: " | "
        label_padding: 1
        ease_slope: 20   # Parâmetros da curva de suavização
        ease_pos: 0.8    # https://www.desmos.com/calculator/j7eamemxzi
        ease_min: 0.5
        always_scroll: false  # Mantém a rolagem do texto mesmo quando ele cabe no widget
      progress_bar:
        enabled: true       # Mostra barra de progresso da música
        alignment: "bottom"  # Alinhamento da barra: "top", "bottom" ou "center"
      class_name: ""  # Classe CSS adicional para personalizar este widget
      symmetric_corner_radius: false  # Aplica o mesmo arredondamento aos cantos da miniatura
      thumbnail_edge_fade: false  # Suaviza as bordas da miniatura
      keybindings: []  # Atalhos globais opcionais; formato: [{keys: "ctrl+alt+x", action: "toggle_label"}]

# --- MEDIA LITE WIDGET ---
# Controle de reprodução de mídia com miniatura da capa e menu de mídia
  media_lite:
    type: "yasb.media_lite.MediaWidget"
    options:
      show_thumbnail: true             # Mostra a miniatura/capa da mídia
      show_title: true                 # Mostra o título da mídia
      show_artist: true                # Mostra o nome do artista
      scrolling_label: false           # Desativa rolagem automática do texto
      image_size: 28                   # Tamanho da miniatura na barra (px)
