      max_label_size: 20               # Número máximo de caracteres exibidos no texto
      tooltip: true                    # Exibe informações adicionais ao passar o mouse

      # --- AÇÕES DO WIDGET ---
      callbacks:
        on_left: "toggle_media_menu"   # Clique esquerdo: abre/fecha o menu de mídia
