# =====================================================================
#                              TASKBAR                                 
# =====================================================================
# Configurações específicas para a barra de tarefas (taskbar)
  yasb-taskbar:
    enabled: false # Habilita esta barra de tarefas personalizada
    context_menu: true # Habilita menu de contexto ao clicar com o botão direito na barra
    screens: 
      - '*' 
    class_name: yasb-bar  
    alignment:
      position: bottom # Posições: "top", "bottom"
      align: center # Alinhamento do conteúdo: "left", "center", "right"
    dimensions: 
      width: 100% # Largura total da barra (pode ser em pixels, ex: "1920px", ou porcentagem, ex: "100%")
      height: 35 # Altura em pixels
    padding: # Espaçamento interno da barra
      top: 0
      left: 0
      bottom: 0
      right: 0
    window_flags:
      always_on_top: false # Mantém a barra sempre visível sobre outras janelas
      windows_app_bar: true # Registra a barra como uma barra do sistema (reserva espaço na tela)
      hide_on_fullscreen: true # Oculta a barra automaticamente quando um aplicativo estiver em tela cheia
      hide_on_maximized: false # Oculta a barra automaticamente quando um aplicativo estiver maximizado
      auto_hide: false # Ativa o recurso de auto-ocultar a barra (aparece ao mover o mouse para a borda da tela)
    blur_effect:
      enabled: false
      dark_mode: false
      round_corners: false
      round_corners_type: normal
      border_color: System
    animation:
      enabled: true
      duration: 500
    layouts:
      left:
        alignment: left
        stretch: true
      center:
        alignment: center
        stretch: true
      right:
        alignment: right
        stretch: true
    widgets:
      left:
        - quick_launch
      center:
        - taskbar
      right:
        - systray
widgets:
  # --- ACTIVE WINDOW WIDGET ---
  # Mostra informações sobre a janela atualmente ativa
  active_window:
    type: "yasb.active_window.ActiveWindowWidget"
    options:
      # Variáveis disponíveis: {win[title]}, {win[class_name]}, {win[process][name]}, {win[hwnd]}
      label: "{win[app_name]}"  # Texto principal (título da janela)
      label_alt: "[class_name='{win[class_name]}' exe='{win[process][name]}' hwnd={win[hwnd]}]"  # Texto alternativo
      label_no_window: "Inscreva-se em www.youtube.com/WINchesterCanal"  # Texto quando nenhuma janela está ativa
      label_icon: true         # Mostra ícone do aplicativo
      monitor_exclusive: false # true = mostra apenas janelas do monitor atual
      class_name: ""  # Classe CSS adicional para personalizar este widget
      label_icon_size: 16  # Tamanho do ícone do aplicativo em pixels
      max_length: null  # Limite de caracteres exibidos
      max_length_ellipsis: "..."  # Texto usado ao abreviar o rótulo
      rewrite: []  # Regras opcionais para substituir partes do título
      ignore_window:  # Janelas que devem ser ignoradas
        classes: []  # Classes de janela ignoradas
        processes: []  # Nomes dos processos ignorados
        titles: []  # Títulos de janela ignorados
      keybindings: []  # Atalhos globais opcionais; formato: [{keys: "ctrl+alt+x", action: "toggle_label"}]
      callbacks:  # Ações ao clicar com os botões do mouse
        on_left: "toggle_label"  # Clique esquerdo
        on_middle: "do_nothing"  # Clique do meio
        on_right: "do_nothing"  # Clique direito

  # --- APPLICATIONS WIDGET ---
  # Atalhos personalizados para aplicativos e ações do sistema
  apps:
    type: "yasb.applications.ApplicationsWidget"
    options:
      label: "{data}"
      app_list:  # Lista de atalhos
        # Formato: {icon: "ícone", launch: "comando ou ação"}
        # Ações especiais: "quick_settings", "notification_center", "search", "widget", "launcher"
        - {icon: "\uDB80\uDDDA", launch: "start cmd.exe /k winget upgrade"}  # Verificar atualizações
        - {icon: "\uDB81\uDEB0", launch: "start cmd.exe /k winget upgrade --all"}  # Atualizar tudo
        - {icon: "\uEAD3", launch: "komorebic start --whkd"}  # Iniciar Komorebi
        - {icon: "\uEAD7", launch: "komorebic stop --whkd"}   # Parar Komorebi
      class_name: ""  # Classe CSS adicional para personalizar este widget
      image_icon_size: 14  # Tamanho dos ícones de imagem em pixels
      tooltip: true  # Informação exibida ao passar o mouse
  

  # --- AUDIO VISUALIZER WIDGET ---
  # Visualizador nativo do áudio do Windows, sem processo externo.
  # Para exibir, adicione "audio_visualizer" a uma lista left, center ou right da barra.
  audio_visualizer:
    type: "yasb.audio_visualizer.AudioVisualizerWidget"
    options:
      class_name: ""  # Classe CSS adicional para personalizar este widget
      style: "bars"  # Estilo do visualizador: bars, waves ou dots
      height: 14  # Altura da área de desenho em pixels
      smoothness: 55  # Suavização dos movimentos de 0 a 100
      sensitivity: 50  # Sensibilidade do visualizador
      auto_gain: true  # Ajusta automaticamente a sensibilidade
      framerate: 60  # Limite de quadros por segundo
      freq_min: 50  # Frequência mínima em Hz
      freq_max: 12000  # Frequência máxima em Hz
      hide_idle: false  # Oculta o visualizador quando não há áudio
      hide_idle_after: 2000  # Tempo sem áudio antes de ocultar, em milissegundos
      channels: "mono"  # Canais de áudio: mono ou stereo
      mono_option: "average"  # Origem do áudio mono: average, left ou right
      reverse: false  # Inverte a ordem das frequências
      mirror: false  # Espelha o desenho a partir do centro vertical
      edge_fade: 0  # Suavização nas bordas em pixels
      bars:  # Configurações do desenho em barras
        count: 24  # Quantidade de elementos visuais
        width: 2  # Largura em pixels
        gap: 4  # Espaçamento em pixels
      waves:  # Configurações do desenho em ondas
        width: 80  # Largura em pixels
      dots:  # Configurações do desenho em pontos
        count: 24  # Quantidade de elementos visuais
        size: 2  # Tamanho em pixels
        gap: 4  # Espaçamento em pixels
      keybindings: []  # Atalhos globais opcionais; formato: [{keys: "ctrl+alt+x", action: "toggle_label"}]
      callbacks:  # Ações ao clicar com os botões do mouse
        on_left: "do_nothing"  # Clique esquerdo
        on_middle: "do_nothing"  # Clique do meio
        on_right: "do_nothing"  # Clique direito

  # --- BATTERY WIDGET ---
  # Indicador de bateria para notebooks
  battery:
    type: "yasb.battery.BatteryWidget"
    options:
      # Variáveis: {icon}, {percent}, {time_remaining}
      label: "<span>{icon}</span> {percent}%"
      label_alt: "<span>{icon}</span> {percent}% | time: {time_remaining}"
      update_interval: 5000           # Atualização em milissegundos
      time_remaining_natural: false   # true = "2h 30m", false = "02:30"
      hide_unsupported: true         # Oculta se não houver bateria
      charging_options:
        icon_format: "{charging_icon}"
        blink_charging_icon: true    # Ícone pisca durante carregamento
        blink_interval: 500          # Intervalo de piscada (ms)
      status_thresholds:  # Limites de porcentagem para cada estado
        critical: 10
        low: 25
        medium: 75
        high: 95
        full: 100
      status_icons:  # Ícones para cada nível
        icon_charging: "\uF0E7"
        icon_critical: "\uF244"
        icon_low: "\uF243"
        icon_medium: "\uF242"
        icon_high: "\uF241"
        icon_full: "\uF240"
      class_name: ""  # Classe CSS adicional para personalizar este widget
      time_remaining_unlimited_icon: "unlimited"  # Símbolo usado quando o tempo restante é ilimitado
      progress_bar:  # Aparência e comportamento do indicador de progresso
        enabled: false  # Ativa ou desativa este recurso
        progress_type: "circular"  # Tipo: circular, linear_horizontal ou linear_vertical
        size: 18  # Tamanho em pixels
        thickness: 3  # Espessura em pixels
        radius: 0  # Raio dos cantos em pixels
        color: "#00C800"  # Cor principal; aceita hexadecimal
        background_color: "#3C3C3C"  # Cor de fundo
        position: "left"  # Posição do elemento
        animation: true  # Animação das mudanças do indicador
      keybindings: []  # Atalhos globais opcionais; formato: [{keys: "ctrl+alt+x", action: "toggle_label"}]
      callbacks:  # Ações ao clicar com os botões do mouse
        on_left: "toggle_label"  # Clique esquerdo
        on_middle: "do_nothing"  # Clique do meio
        on_right: "do_nothing"  # Clique direito
  

  # --- BLUETOOTH WIDGET ---
  # Status e controle de dispositivos Bluetooth
  bluetooth:
    type: "yasb.bluetooth.BluetoothWidget"
    options:
      # Variáveis: {icon}, {device_count}, {device_name}
      label: "<span>{icon}</span> {device_count}"
      label_alt: "{device_name}"
      label_no_device: "Sem dispositivos conectados"
      label_device_separator: ", "   # Separador para múltiplos dispositivos
      max_length: 10
      max_length_ellipsis: "..."
      icons:
        bluetooth_on: "\uDB80\uDCAF"       # Bluetooth ligado
        bluetooth_off: "\uDB80\uDCB2"      # Bluetooth desligado
        bluetooth_connected: "\uDB80\uDCB1"  # Dispositivo conectado
      device_aliases:  # Apelidos personalizados para dispositivos
        - name: "T5.0"
          alias: "\uF025"
      callbacks:
        on_left: "toggle_menu"  # Clique esquerdo: abre ou fecha o menu de dispositivos Bluetooth
        on_right: "exec cmd.exe /c start ms-settings:bluetooth"  # Abre configurações
        on_middle: "toggle_label"  # Clique do meio: alterna o texto do widget
      class_name: ""  # Classe CSS adicional para personalizar este widget
      tooltip: true  # Informação exibida ao passar o mouse
      keybindings: []  # Atalhos globais opcionais; formato: [{keys: "ctrl+alt+x", action: "toggle_label"}]
      menu_config:  # Aparência e controles do menu de Bluetooth
        blur: true  # Ativa o efeito de desfoque
        round_corners: true  # Arredonda os cantos da janela
        round_corners_type: "normal"  # Tipo de arredondamento: normal ou small
        border_color: "System"  # Cor da borda: System, None ou uma cor hexadecimal
        alignment: "center"  # Alinhamento horizontal: left, center ou right
        direction: "down"  # Direção de abertura: up ou down
        offset_top: 6  # Deslocamento vertical em pixels
        offset_left: 0  # Deslocamento horizontal em pixels
        labels:  # Ajuste de rótulos
          connect: "Conectar"  # Ajuste de conectar
          connected: "Conectado"  # Ajuste de conectado
          connecting: "Conectando..."  # Ajuste de conectando
          disconnect: "Desconectar"  # Ajuste de desconectar
          disconnecting: "Desconectando..."  # Ajuste de desconectando
          manage: "Gerenciar"  # Ajuste de gerenciar
          more_settings: "Mais configura\u00e7\u00f5es de Bluetooth"  # Ajuste de mais configurações
          new_devices: "Novos dispositivos"  # Título da lista de novos dispositivos
          not_connected: "N\u00e3o conectado"  # Ajuste de não conectado
          pair: "Parear"  # Ajuste de parear
          power_off: "Desligado"  # Ícone para desligar o Bluetooth
          power_on: "Ligado"  # Ícone para ligar o Bluetooth
          title: "Bluetooth"  # Título exibido
          your_devices: "Seus dispositivos"  # Título da lista de dispositivos conhecidos
        device_icons:  # Ícones por tipo de dispositivo
          battery:  # Ícone de bateria
            empty: "\ueba0"  # Ajuste de vazio
            full: "\uebaa"  # Ícone do estado completo
            high: "\ueba8"  # Limite ou ícone do estado alto
            low: "\ueba2"  # Limite ou ícone do estado baixo
            medium: "\ueba5"  # Limite ou ícone do estado médio
          camera: "\ue722"  # Ajuste de câmera
          computer: "\ue950"  # Ajuste de computador
          controller: "\ue7fc"  # Ajuste de controle
          generic: "\ue702"  # Ajuste de genérico
          headphones: "\ue7f6"  # Ajuste de fones de ouvido
          headset: "\ue95b"  # Ajuste de fone com microfone
          keyboard: "\ue765"  # Ajuste de teclado
          laptop: "\ue7f8"  # Ajuste de notebook
          mouse: "\ue962"  # Ajuste de mouse
          phone: "\ue8ea"  # Ajuste de telefone
          scan: "\ue72c"  # Ajuste de leitura
          speaker: "\ue7f5"  # Ajuste de alto-falante
          tablet: "\ue70a"  # Ajuste de tablet
          watch: "\ue918"  # Ajuste de observar
  

  # --- BRIGHTNESS WIDGET ---
  # Controle de brilho da tela (notebooks)
  brightness:
    type: "yasb.brightness.BrightnessWidget"
    options:
      label: "<span>{icon}</span>"
      label_alt: "Brightness {percent}%"
      tooltip: true
      brightness_toggle_level: [0, 50, 100]  # Níveis de alternância ao clicar
      auto_light: false          # Ajuste automático dia/noite
      auto_light_icon: "\uDB80\uDCE1"
      auto_light_night_level: 35     # Brilho noturno (%)
      auto_light_night_start_time: "19:00"
      auto_light_night_end_time: "06:45"
      auto_light_day_level: 75       # Brilho diurno (%)
      brightness_icons: ["\uDB80\uDCDE", "\uDB80\uDCDD", "\uDB80\uDCDF", "\uDB80\uDCE0" # Icon for 76-100% brightness
]
      brightness_menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "System"
        alignment: "right"
        direction: "down"
        offset_top: 6  # Deslocamento vertical em pixels
        offset_left: 0  # Deslocamento horizontal em pixels
        contrast_icon: "\ue7a1"  # Ícone do contraste
        brightness_icon: "\ue706"  # Ícone do brilho
      callbacks:
        on_left: "toggle_label"
        on_middle: "do_nothing"  # Clique do meio
        on_right: "do_nothing"  # Clique direito
      scroll_step: 1  # Quantidade alterada a cada passo da roda do mouse
      invert_wheel: false  # Inverte o sentido da roda do mouse
      ddc_poll_interval: 60  # Intervalo de consulta do brilho dos monitores DDC em segundos
      progress_bar:  # Aparência e comportamento do indicador de progresso
        enabled: false  # Ativa ou desativa este recurso
        progress_type: "circular"  # Tipo: circular, linear_horizontal ou linear_vertical
        size: 18  # Tamanho em pixels
        thickness: 3  # Espessura em pixels
        radius: 0  # Raio dos cantos em pixels
        color: "#00C800"  # Cor principal; aceita hexadecimal
        background_color: "#3C3C3C"  # Cor de fundo
        position: "left"  # Posição do elemento
        animation: true  # Animação das mudanças do indicador
      keybindings: []  # Atalhos globais opcionais; formato: [{keys: "ctrl+alt+x", action: "toggle_label"}]
  

  # --- CAVA WIDGET ---
  # Visualizador de áudio (estilo equalizer)
  # NOTA: Este widget requer que a versão do Cava seja igual ou superior a 0.10.4 instalada no seu sistema.
  # Você pode instalá-lo usando o winget (winget install karlstav.cava) ou a partir do repositório oficial https://github.com/karlstav/cava/releases.
  # O Cava precisa estar acessível no sistema PATH.
  # O YASB criará arquivos de configuração temporários para busca no diretório %LOCALAPPDATA%\YASB.
  cava:
    type: "yasb.cava.CavaWidget"
    options:
      bar_height: 12          # Altura das barras
      min_bar_height: 0       # Altura mínima
      gradient: 1             # 0 = cor sólida, 1 = gradiente
      foreground: "#89b4fa"   # Cor principal
      gradient_color_1: '#74c7ec'  # Cor inicial do gradiente
      gradient_color_2: '#89b4fa'
      gradient_color_3: '#cba6f7'
      bars_number: 8          # Número de barras
      bar_spacing: 2          # Espaçamento entre barras
      bar_width: 4            # Largura de cada barra
      bar_type: "bars"        # Tipo: "bars", "wave"
      framerate: 60           # Taxa de atualização (FPS)
      hide_empty: true        # Oculta quando não há áudio
      class_name: ""  # Classe CSS adicional para personalizar este widget
      source: "auto"  # Origem do áudio; auto ou vazio usa a seleção padrão do visualizador
      output_bit_format: "16bit"  # Profundidade de bits da saída do Cava
      orientation: "bottom"  # Orientação do visualizador
      sleep_timer: 0  # Tempo de inatividade antes de suspender o Cava
      sensitivity: 100  # Sensibilidade do visualizador
      lower_cutoff_freq: 50  # Frequência mínima em Hz
      higher_cutoff_freq: 10000  # Frequência máxima em Hz
      noise_reduction: 77  # Redução de ruído do visualizador
      channels: "stereo"  # Canais de áudio: mono ou stereo
      mono_option: "average"  # Origem do áudio mono: average, left ou right
      reverse: 0  # Inverte a ordem das frequências
      waveform: 0  # Usa a forma de onda em vez do espectro
      monstercat: 1  # Suavização do espectro no estilo Monstercat
      waves: 0  # Configurações do desenho em ondas
      edge_fade: 0  # Suavização nas bordas em pixels
      keybindings: []  # Atalhos globais opcionais; formato: [{keys: "ctrl+alt+x", action: "toggle_label"}]
      callbacks:  # Ações ao clicar com os botões do mouse
        on_left: "do_nothing"  # Clique esquerdo
        on_middle: "do_nothing"  # Clique do meio
        on_right: "reload_cava"  # Clique direito

  # --- CLAUDE USAGE WIDGET ---
  # Mostra o consumo dos limites de 5 horas e 7 dias do Claude Code. Requer login no Claude Code.
  # Para exibir, adicione "claude_usage" a uma lista left, center ou right da barra.
  claude_usage:
    type: "yasb.claude_usage.ClaudeUsageWidget"
    options:
      label: "Claude {five_hour}%"  # Texto principal; aceita as variáveis do widget
      label_alt: "Claude {seven_day}% semanal"  # Texto alternativo ao alternar o rótulo
      update_interval: 60  # Intervalo entre atualizações; consulte a unidade na documentação do widget
      cache_ttl: 120  # Tempo de validade do cache em segundos
      token_history:  # Histórico local de tokens; ativação opcional
        enabled: false  # Ativa ou desativa este recurso
        default_period: "today"  # Período inicial: session, today, week, month ou year
        show_graph: false  # Exibe o gráfico de consumo
        show_graph_grid: false  # Exibe a grade do gráfico
        show_models: false  # Exibe a distribuição por modelo
        week_starts_on: "monday"  # Primeiro dia da semana: monday ou sunday
        count_cache_read: true  # Inclui tokens lidos do cache no total
        scan_interval: 120  # Intervalo de leitura dos registros locais em segundos
      status:  # Indicador opcional de disponibilidade do serviço
        enabled: false  # Ativa ou desativa este recurso
        show_in_menu: true  # Exibe o indicador de estado no menu
        icon: "\u25cf"  # Ícone exibido
        poll_interval: 300  # Intervalo de consulta do serviço em segundos
      five_hour_reset_format: "relative"  # Formato da renovação de 5 horas: relative ou absolute
      seven_day_reset_format: "absolute"  # Formato da renovação semanal: relative ou absolute
      reset_show_date: true  # Inclui a data na renovação exibida
      tooltip: true  # Informação exibida ao passar o mouse
      callbacks:  # Ações ao clicar com os botões do mouse
        on_left: "toggle_menu"  # Clique esquerdo
        on_middle: "do_nothing"  # Clique do meio
        on_right: "toggle_label"  # Clique direito
      menu:  # Aparência e posicionamento do menu
        blur: true  # Ativa o efeito de desfoque
        round_corners: true  # Arredonda os cantos da janela
        round_corners_type: "normal"  # Tipo de arredondamento: normal ou small
        border_color: "System"  # Cor da borda: System, None ou uma cor hexadecimal
        alignment: "right"  # Alinhamento horizontal: left, center ou right
        direction: "down"  # Direção de abertura: up ou down
        offset_top: 6  # Deslocamento vertical em pixels
        offset_left: 0  # Deslocamento horizontal em pixels
        pin_icon: "\ue718"  # Ícone para fixar a janela
        unpin_icon: "\ue77a"  # Ícone para desafixar a janela
      keybindings: []  # Atalhos globais opcionais; formato: [{keys: "ctrl+alt+x", action: "toggle_label"}]

  # --- CLOCK WIDGET ---
  # Relógio com calendário, fusos horários e alarmes
  clock:
    type: "yasb.clock.ClockWidget"
    options:
      # Formatação: use códigos strftime do Python
      # %a=dia semana, %d=dia, %B=mês, %H=hora 24h, %I=hora 12h, %M=minuto, %S=segundo, %p=AM/PM
      label: "<span>{icon}</span> <span>{alarm}</span> {%a, %d de %B %H:%M:%S}"
      label_alt: "Inscreva-se e deixa o like! \uF164"
      locale: "pt_BR"         # Locale para nomes de meses/dias
      update_interval: 1000   # Atualização em ms
      timezones: []           # Lista de fusos: ["America/New_York", "Europe/London"]
      icons:  # Ícones de relógio para cada hora (1-12)
        clock_01: "\uDB85\uDC3F"
        clock_02: "\uDB85\uDC40"
        clock_03: "\uDB85\uDC41"
        clock_04: "\uDB85\uDC42"
        clock_05: "\uDB85\uDC43"
        clock_06: "\uDB85\uDC44"
        clock_07: "\uDB85\uDC45"
        clock_08: "\uDB85\uDC46"
        clock_09: "\uDB85\uDC47"
        clock_10: "\uDB85\uDC48"
        clock_11: "\uDB85\uDC49"
        clock_12: "\uDB85\uDC4A"
      alarm_icons:
        enabled: "\uF0F3"
        disabled: "\uF0A2"
        snooze: "\uF1F6"
      calendar:  # Configuração do popup de calendário
        blur: true
        round_corners: true
        round_corners_type: 'normal'
        border_color: 'System'
        alignment: 'center'
        direction: 'down'
        show_holidays: true      # Mostra feriados
        show_week_numbers: true   # Mostra número da semana
        country_code: "BR"        # Código do país para feriados
        holiday_color: "#FF6464"  # Cor dos feriados
        extended: true           # Calendário expandido
        offset_top: 6  # Deslocamento vertical em pixels
        offset_left: 0  # Deslocamento horizontal em pixels
        subdivision: null  # Subdivisão regional usada no calendário de feriados
        show_years: false  # Exibe a seleção de anos no calendário
      callbacks:
        on_left: "toggle_calendar"
        on_middle: "next_timezone"
        on_right: "toggle_label"
      class_name: ""  # Classe CSS adicional para personalizar este widget
      tooltip: true  # Informação exibida ao passar o mouse
      keybindings: []  # Atalhos globais opcionais; formato: [{keys: "ctrl+alt+x", action: "toggle_label"}]

  # --- CODEX USAGE WIDGET ---
  # Mostra os limites restantes do Codex; requer Codex CLI instalado e login com uma conta ChatGPT.
  # Para exibir, adicione "codex_usage" a uma lista left, center ou right da barra.
  codex_usage:
    type: "yasb.codex_usage.CodexUsageWidget"
    options:
      label: "Codex {primary_remaining}% restante"  # Texto principal; aceita as variáveis do widget
      label_alt: "Codex {secondary_window}: {secondary_remaining}% restante"  # Texto alternativo ao alternar o rótulo
      codex_path: "codex"  # Comando ou caminho completo do executável do Codex CLI
      update_interval: 60  # Intervalo entre atualizações; consulte a unidade na documentação do widget
      cache_ttl: 120  # Tempo de validade do cache em segundos
      timeout: 15.0  # Tempo limite de resposta em segundos
      tooltip: true  # Informação exibida ao passar o mouse
      show_token_usage: true  # Inclui o histórico local de uso de tokens
      stale_icon: "\u26a0"  # Ícone de aviso quando os dados estão desatualizados
      progress_bar:  # Aparência e comportamento do indicador de progresso
        enabled: true  # Ativa ou desativa este recurso
        progress_type: "linear_horizontal"  # Tipo: circular, linear_horizontal ou linear_vertical
        size: 36  # Tamanho em pixels
        thickness: 6  # Espessura em pixels
        radius: 3  # Raio dos cantos em pixels
        color: "#4caf50"  # Cor principal; aceita hexadecimal
        background_color: "#3c3c3c"  # Cor de fundo
        position: "left"  # Posição do elemento
        animation: true  # Animação das mudanças do indicador
      callbacks:  # Ações ao clicar com os botões do mouse
        on_left: "toggle_menu"  # Clique esquerdo
        on_middle: "refresh"  # Clique do meio
        on_right: "toggle_label"  # Clique direito
      menu:  # Aparência e posicionamento do menu
        blur: true  # Ativa o efeito de desfoque
        round_corners: true  # Arredonda os cantos da janela
        round_corners_type: "normal"  # Tipo de arredondamento: normal ou small
        border_color: "System"  # Cor da borda: System, None ou uma cor hexadecimal
        alignment: "right"  # Alinhamento horizontal: left, center ou right
        direction: "down"  # Direção de abertura: up ou down
        offset_top: 6  # Deslocamento vertical em pixels
        offset_left: 0  # Deslocamento horizontal em pixels
        show_overview: true  # Exibe o resumo de uso
        show_models: true  # Exibe a distribuição por modelo
        show_activity: true  # Exibe a atividade local
        show_resets: true  # Exibe os horários de renovação dos limites
        show_details: true  # Exibe os detalhes da conta e dos limites
        refresh_icon: "\ue72c"  # Ícone do botão de atualizar
        previous_page_icon: "\ue76b"  # Ícone da página anterior
        next_page_icon: "\ue76c"  # Ícone da próxima página
      keybindings: []  # Atalhos globais opcionais; formato: [{keys: "ctrl+alt+x", action: "toggle_label"}]

# --- CONTROL CENTER WIDGET ---
# Central de controle com ações rápidas, controles de brilho/volume/microfone,
  # reprodução de mídia e opções de energia
  control_center:
    type: "yasb.control_center.ControlCenterWidget"
    options:
      label: "<span>\ue7e8</span>"  # Ícone da central de controle (Segoe Fluent Icons / Segoe MDL2 Assets)
      tooltip: true                 # Exibe informações ao passar o mouse

      # Ordem das seções exibidas dentro da central de controle
      sections_order:
        - "system_controls"
        - "quick_actions"
        - "sliders"
        - "power"
        - "media"

      # --- JANELA DA CENTRAL ---
      popup:
        alignment: "center"            # Alinhamento horizontal do menu
        direction: "down"              # Direção em que o menu será aberto
        border_color: System           # Cor da borda: "System" usa a cor do sistema
        round_corners: true             # Arredonda os cantos do menu
        round_corners_type: normal      # Tipo de arredondamento
        offset_top: 8                  # Distância entre o widget e o menu (px)
        blur: true  # Ativa o efeito de desfoque
        offset_left: 0  # Deslocamento horizontal em pixels

      # --- CONTROLES DO SISTEMA ---
      sections:
        system_controls:
          profile_image_size: 28       # Tamanho da imagem do perfil (px)
          power_icon: "\uE7E8"          # Ícone do botão de energia
          lock_icon: "\uE72E"           # Ícone do botão de bloqueio
          settings_icon: "\uE713"       # Ícone do botão de configurações
          show: true  # Ajuste de exibição

        # --- AÇÕES RÁPIDAS ---
        quick_actions:
          show: true                   # Exibe a seção de ações rápidas
          columns: 3                   # Número de colunas dos botões
          label_position: "default"    # Posição do texto dos botões
          actions:
            - id: "toggle_dnd"
              label: "N\u00e3o perturbe"
              icon: "\uf285"

            - id: "toggle_mute"
              label: "Silenciar \u00e1udio"
              icon: "\ue74f"

            - id: "toggle_mic_mute"
              label: "Silenciar microfone"
              icon: "\ue720"  # Ícone de microfone compatível com Segoe

            - id: "screenshot"
              label: "Captura de tela"
              icon: "\ue91b"

            - id: "touch_keyboard"
              label: "Teclado virtual"
              icon: "\uE765"

            - id: "toggle_theme"
              label: "Tema escuro"
              icon: "\uE708"

        # --- CONTROLES DESLIZANTES ---
        sliders:
          show: true                  # Exibe a seção de controles deslizantes

          # Controle de brilho da tela
          brightness:
            show_slider: true
            icon: "\uE706"
            show_source_selector: true
            source_selector_icon: "\uE972"

          # Controle do volume do sistema
          volume:
            show_slider: true
            icon: "\uE767"
            show_source_selector: true
            source_selector_icon: "\uE972"

          # Controle do volume do microfone
          microphone:
            show_slider: true
            icon: "\uE720"
            show_source_selector: true
            source_selector_icon: "\uE972"

        # --- CONTROLES DE MÍDIA ---
        media:
          show: true
          thumbnail_size: 36         # Tamanho da miniatura da mídia (px)
          thumbnail_radius: 4        # Arredondamento da miniatura (px)
          icons:
            prev_track: "\ue892"  # Faixa anterior
            next_track: "\ue893"  # Próxima faixa
            play: "\ue768"  # Reproduzir
            pause: "\ue769"  # Pausar

        # --- CONTROLES DE ENERGIA ---
        power:
          show: true
          power_plan_title: "Plano de energia"
          power_mode_title: "Modo de energia"
          button_menu_icon: "\ue76c"  # Ícone do menu de opções de energia

      # --- AÇÕES DO WIDGET ---
      callbacks:
        on_left: "toggle_menu"        # Clique esquerdo: abre/fecha a central de controle
        on_middle: "do_nothing"  # Clique do meio
        on_right: "do_nothing"  # Clique direito
      label_alt: "<span>\ue90a</span>"  # Texto alternativo ao alternar o rótulo
      class_name: ""  # Classe CSS adicional para personalizar este widget
      keybindings: []  # Atalhos globais opcionais; formato: [{keys: "ctrl+alt+x", action: "toggle_label"}]

  # --- COPILOT WIDGET ---
  # Monitor de uso do GitHub Copilot
  copilot:
    type: "yasb.copilot.CopilotWidget"
    options:
      label: "{icon}"                          # Texto principal exibido na barra (usa variáveis: {icon}, {used}, {allowance}, {percent})
      label_alt: "{used}/{allowance}"          # Texto alternativo ao clicar (mostra uso: usado/limite)
      token: "github_pat_xxxxxxxxxxxx"         # Token de acesso pessoal do GitHub (obtenha em github.com/settings/tokens)
      plan: "pro"                              # Seu plano do Copilot: "pro" ou "pro_plus"
      tooltip: true                            # Exibe tooltip ao passar o mouse (mostra uso detalhado)
      update_interval: 120                     # Intervalo de atualização em segundos (120s = 2 minutos)
      icons:                                   # Ícones personalizados (FontAwesome/Nerd Fonts)
        copilot: "\uF113"                      # Ícone normal do Copilot
        error: "\uF071"                        # Ícone de erro quando falha ao conectar
      thresholds:                              # Limites de uso para alertas visuais (porcentagem)
        warning: 75                            # Aviso ao atingir 75% do limite
        critical: 90                           # Crítico ao atingir 90% do limite
      menu:                                    # Configurações do menu popup
        blur: true                             # Efeito de desfoque no fundo
        round_corners: true                    # Cantos arredondados
        round_corners_type: "normal"           # Tipo de arredondamento: "normal" ou "small"
        border_color: "System"                 # Cor da borda: "System", "None" ou HEX (#RRGGBB)
        alignment: "right"                     # Alinhamento do popup: "left", "center", "right"
        direction: "down"                      # Direção do popup: "up" ou "down"
        offset_top: 6                          # Deslocamento vertical em pixels
        offset_left: 0                         # Deslocamento horizontal em pixels
        chart: true                            # Exibe gráfico de uso no popup
      keybindings: []  # Atalhos globais opcionais; formato: [{keys: "ctrl+alt+x", action: "toggle_label"}]
      callbacks:  # Ações ao clicar com os botões do mouse
        on_left: "toggle_popup"  # Clique esquerdo
        on_middle: "do_nothing"  # Clique do meio
        on_right: "toggle_label"  # Clique direito

  # --- CPU WIDGET ---
  # Indicador de uso da CPU
  cpu:
    type: "yasb.cpu.CpuWidget"
    options:
      label: "<span>\uF4BC</span> {info[percent][total]}%" # Texto principal com ícone e uso total da CPU
      label_alt: "<span>\uF437</span> {info[freq][current]} MHz" # Texto alternativo com frequência atual
      update_interval: 2000
      cpu_thresholds:
        low: 25
        medium: 50
        high: 90
      histogram_icons:
        - "\u2581" # 0%
        - "\u2581" # 10%
        - "\u2582" # 20%
        - "\u2583" # 30%
        - "\u2584" # 40%
        - "\u2585" # 50%
        - "\u2586" # 60%
        - "\u2587" # 70%
        - "\u2588" # 80%+
      histogram_num_columns: 8
      callbacks:
        on_left: "toggle_menu" # Exibe menu com detalhes da CPU
        on_right: "toggle_label" # Alterna entre label principal e alternativo
        on_middle: "exec cmd /c Taskmgr" # Abre o Gerenciador de Tarefas do Windows
      menu:
        enabled: true # Habilita menu popup com gráfico de uso detalhado
        alignment: "center"
        show_graph: true # Exibe gráfico de uso da CPU
        show_graph_grid: true # Exibe grade no gráfico
        graph_history_size: 60 # Número de pontos no gráfico (ex: 60 para 2 minutos com update_interval de 2000ms)
        blur: true  # Ativa o efeito de desfoque
        round_corners: true  # Arredonda os cantos da janela
        round_corners_type: "normal"  # Tipo de arredondamento: normal ou small
        border_color: "System"  # Cor da borda: System, None ou uma cor hexadecimal
        direction: "down"  # Direção de abertura: up ou down
        offset_top: 6  # Deslocamento vertical em pixels
        offset_left: 0  # Deslocamento horizontal em pixels
        pin_icon: "\ue718"  # Ícone para fixar a janela
        unpin_icon: "\ue77a"  # Ícone para desafixar a janela
      class_name: ""  # Classe CSS adicional para personalizar este widget
      hide_decimal: false  # Oculta as casas decimais
      progress_bar:  # Aparência e comportamento do indicador de progresso
        enabled: false  # Ativa ou desativa este recurso
        progress_type: "circular"  # Tipo: circular, linear_horizontal ou linear_vertical
        size: 18  # Tamanho em pixels
        thickness: 3  # Espessura em pixels
        radius: 0  # Raio dos cantos em pixels
        color: "#00C800"  # Cor principal; aceita hexadecimal
        background_color: "#3C3C3C"  # Cor de fundo
        position: "left"  # Posição do elemento
        animation: true  # Animação das mudanças do indicador
      keybindings: []  # Atalhos globais opcionais; formato: [{keys: "ctrl+alt+x", action: "toggle_label"}]

  # --- DISK WIDGET ---
  # Monitor de espaço em disco
  disk:
    type: "yasb.disk.DiskWidget"
    options:
      # Variáveis: {volume_label}, {space[used/free/total][gb/percent]}
      label: "{volume_label}: {space[used][percent]}"
      label_alt: "{volume_label} {space[used][gb]} / {space[total][gb]}"
