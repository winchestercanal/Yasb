        artwork_dim: 0.55               # Escurecimento da imagem de fundo
        round_corners: true             # Arredonda os cantos do menu
        round_corners_type: "normal"     # Tipo de arredondamento: "normal", "small"
        border_color: "System"           # Cor da borda: "System", "None" ou cor HEX
        alignment: "center"             # Alinhamento horizontal: "left", "center", "right"
        direction: "down"               # Direção do menu: "down" ou "up"
        offset_top: 6                   # Distância vertical entre o widget e o menu (px)
        offset_left: 0                  # Deslocamento horizontal do menu (px)
        image_size: 160                 # Tamanho da capa dentro do menu (px)
        thumbnail_corner_radius: 12     # Arredondamento da capa dentro do menu (px)

        # --- ÍCONES DOS CONTROLES ---
        icons:
          play: "\ue768"                # Reproduzir
          pause: "\ue769"               # Pausar
          prev_track: "\ue892"          # Faixa anterior
          next_track: "\ue893"          # Próxima faixa
          shuffle: "\ue8b1"              # Reprodução aleatória
          repeat: "\ue8ee"               # Repetir
          repeat_one: "\ue8ed"           # Repetir faixa atual
          volume: "\ue767"               # Volume
          mute: "\ue994"                 # Silenciar
      class_name: ""  # Classe CSS adicional para personalizar este widget
      keybindings: []  # Atalhos globais opcionais; formato: [{keys: "ctrl+alt+x", action: "toggle_label"}]

  # --- MEMORY WIDGET ---
