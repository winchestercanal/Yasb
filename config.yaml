# - glazewm_tiling_direction: Exibe e alterna a divisão horizontal ou vertical das janelas do GlazeWM
# - glazewm_workspaces: Exibe e permite alternar os espaços de trabalho do GlazeWM
# - glucose_monitor: Mostra dados de um servidor Nightscout. Configure host e a variável YASB_CGM_SECRET antes de ativar
