watch_stylesheet: true
watch_config: true
debug: true
komorebi:
  start_command: "komorebic start --whkd"      # Comando para iniciar o Komorebi
  stop_command: "komorebic stop --whkd"        # Comando para parar o Komorebi
  reload_command: "komorebic reload-configuration"  # Comando para recarregar configuração

# ============================================================
# CONFIGURAÇÃO DA BARRA DE STATUS
# ============================================================
bars:
  status-bar:
    enabled: true  # Habilita/desabilita esta barra

    # --- SELEÇÃO DE TELAS ---
    # Defina em quais monitores a barra aparecerá
    screens: ['*']  # '*' = todas as telas
    # screens: ['DELL P2419H (1)']  # Exemplo para tela específica | use o comando "yasbc monitor-information" no terminal para obter os nomes de suas telas
    class_name: "yasb-bar"  # Nome da classe CSS para estilização customizada
    style: "adaptive"

    # --- POSICIONAMENTO ---
    alignment:
      position: "top"   # Posições: "top", "bottom"
    # --- EFEITOS VISUAIS (Windows 11) ---
    blur_effect:
      enabled: false     # Ativa efeito de desfoque na barra
      dark_mode: true   # Adiciona mais sombra ao desfoque
      round_corners: true  # Cantos arredondados
      border_color: System  # Opções: "System", "None", ou cor HEX (#RRGGBB)

    # --- COMPORTAMENTO DA JANELA ---
    window_flags:
      always_on_top: false    # Mantém barra sempre visível sobre outras janelas
      windows_app_bar: true   # Registra como barra do sistema (reserva espaço)

    # --- DIMENSÕES ---
    dimensions:
      width: "100%"  # Largura: porcentagem ou pixels (ex: "1920px")
      height: 36     # Altura em pixels

    # --- ESPAÇAMENTO INTERNO ---
    padding:
      top: 0      # Espaço superior
      left: 0     # Espaço esquerdo
      bottom: 4   # Espaço inferior
      right: 0    # Espaço direito

    # --- DISTRIBUIÇÃO DE WIDGETS ---
    # Organize widgets em três áreas: esquerda, centro e direita
    widgets:
      left:   # Widgets alinhados à esquerda
        [
          "home",                      # Menu de início com atalhos, algumas pastas vao exigir que voce configure o endereço manualmente para funcionar.
          "wallpapers",                # Gerenciador de papéis de parede
          "komorebi_control",          # Controles do Komorebi
          "komorebi_workspaces",       # Espaços de trabalho do Komorebi
          "komorebi_active_layout",    # Layout ativo do Komorebi
          "active_window",             # Título da janela ativa
          "audio_visualizer",          # Visualizador de áudio nativo do Windows
        ] 
      center: # Widgets centralizados
        [
         "notes",          # Notas rápidas
         "todo",           # Lista de tarefas
         "clock",          # Relógio e calendário
         "open_meteo",     # Previsão do tempo usando a API Open-Meteo (sem necessidade de chave de API)
         "update_check",   # Exibe atualizaçoes pendentes de apps e do Windows
        ]
      right:  # Widgets alinhados à direita
        [
          "obs",                   # Status do OBS Studio
          "grouper",               # Monitor de uso da CPU
          "bluetooth",             # Status e controle Bluetooth
          "volume",                # Controle de volume
          "whkd",                  # Atalhos de teclado ativos
          "control_center",        # Central de controle do Windows
        ]

# =====================================================================
#                     CATÁLOGO DE WIDGETS DISPONÍVEIS
# =====================================================================
# Para exibir um widget, adicione seu nome à lista left, center ou right.
# Os widgets de um Grouper já aparecem dentro dele; evite duplicá-los.
#
# - active_window: Mostra informações sobre a janela atualmente ativa
# - apps: Atalhos personalizados para aplicativos e ações do sistema
# - audio_visualizer: Visualizador nativo do áudio do Windows, sem processo externo
# - battery: Indicador de bateria para notebooks
# - bluetooth: Status e controle de dispositivos Bluetooth
# - brightness: Controle de brilho da tela (notebooks)
# - cava: Visualizador de áudio (estilo equalizer)
# - claude_usage: Mostra o consumo dos limites de 5 horas e 7 dias do Claude Code. Requer login no Claude Code
# - clock: Relógio com calendário, fusos horários e alarmes
# - codex_usage: Mostra os limites restantes do Codex; requer Codex CLI instalado e login com uma conta ChatGPT
# - control_center: Central de controle com ações rápidas, brilho, volume, microfone, mídia e energia
# - copilot: Monitor de uso do GitHub Copilot
# - cpu: Indicador de uso da CPU
# - disk: Monitor de espaço em disco
# - disk_group: Mostra um grupo de unidades de disco com espaço usado e disponível
# - dnd: Ativa e controla o modo Não Perturbe do Windows
# - github: Notificações do GitHub
# - glazewm-grouper: Agrupa widgets relacionados ao GlazeWM
