# --- OPEN METEO WIDGET ---
  # Previsão do tempo usando a API Open-Meteo (sem necessidade de chave de API)
  open_meteo:
    type: "yasb.open_meteo.OpenMeteoWidget"
    options:
      # Variáveis disponíveis: {icon}, {temp}, {location}, {min_temp}, {max_temp}, {humidity}
      label: "<span>{icon}</span> {temp}"          # Ícone + temperatura atual
      label_alt: "{location}: Min {min_temp}, Max {max_temp}, Humidity {humidity}"  # Informações detalhadas
      tooltip: true           # Exibe tooltip ao passar o mouse
      update_interval: 600    # Intervalo de atualização em segundos (600 = 10 minutos)
      hide_decimal: true      # Oculta casas decimais da temperatura
      units: "metric"         # Sistema de unidades: "metric" (°C) ou "imperial" (°F)
      callbacks:
        on_left: "toggle_card"    # Abre/fecha o card de previsão
        on_middle: "do_nothing"   # Sem ação
        on_right: "toggle_label"  # Alterna entre label e label_alt
      icons:  # Ícones para cada condição climática (Nerd Fonts)
        sunnyDay: "\uE30D"              # Dia ensolarado
        clearNight: "\uE32B"            # Noite limpa
        cloudyDay: "\uE312"             # Dia nublado
        cloudyNight: "\uE311"           # Noite nublada
        drizzleDay: "\uDB81\uDE7E"      # Garoa diurna
        drizzleNight: "\uDB81\uDE7E"    # Garoa noturna
        rainyDay: "\uE308"              # Chuva diurna
        rainyNight: "\uE333"            # Chuva noturna
        snowyDay: "\uE30A"              # Neve diurna
        snowyNight: "\uE335"            # Neve noturna
        foggyDay: "\uE303"              # Neblina diurna
        foggyNight: "\uE346"            # Neblina noturna
        thunderstormDay: "\uE30F"       # Tempestade diurna
        thunderstormNight: "\uE338"     # Tempestade noturna
        default: "\uEBAA"               # Ícone padrão (condição desconhecida)
      weather_card:  # Configurações do card de previsão detalhada
        blur: true                      # Efeito de desfoque no fundo
        round_corners: true             # Cantos arredondados
        round_corners_type: "normal"    # Tipos: "normal", "small"
        border_color: "system"          # "system", "none", ou cor HEX
        alignment: "center"              # Alinhamento: "left", "center", "right"
        direction: "down"               # Direção do popup: "up", "down"
        icon_size: 48                   # Tamanho do ícone principal em pixels
        show_hourly_forecast: true      # Exibe previsão hora a hora
        time_format: "24h"              # Formato de hora: "24h" ou "12h"
        hourly_point_spacing: 76        # Espaçamento entre pontos do gráfico horário
        hourly_icon_size: 24            # Tamanho dos ícones da previsão horária
        icon_smoothing: true            # Suavização dos ícones
        temp_line_width: 2              # Espessura da linha de temperatura
        current_line_color: "#8EAEE8"   # Cor da linha do horário atual
        current_line_width: 1           # Espessura da linha do horário atual
        current_line_style: "dot"       # Estilo da linha: "dot", "dash", "solid"
        hourly_gradient:
          enabled: true                # Ativa gradiente sob a linha de temperatura
          top_color: "#8EAEE8"          # Cor superior do gradiente
          bottom_color: "#2A3E68"       # Cor inferior do gradiente
        hourly_forecast_buttons:
          enabled: true                         # Exibe botões para alternar visualização
          default_view: "temperature"           # Visualização padrão: "temperature", "rain", "snow"
          temperature_icon: "\uDB81\uDD99"      # Ícone do botão de temperatura
          rain_icon: "\uDB81\uDD96"             # Ícone do botão de chuva
          snow_icon: "\uDB81\uDD98"             # Ícone do botão de neve
        weather_animation:
          enabled: true              # Ativa animações climáticas no card
          snow_overrides_rain: true   # Neve sobrepõe chuva
          temp_line_animation_style: both  # "rain", "snow", "both", "none"
          rain_effect_intensity: 1.0  # Intensidade da animação de chuva (0.01 - 10.0)
          snow_effect_intensity: 1.0  # Intensidade da animação de neve (0.01 - 10.0)
          scale_with_chance: true     # Escala a intensidade com a % de precipitação
        offset_top: 6  # Deslocamento vertical em pixels
        offset_left: 0  # Deslocamento horizontal em pixels
      class_name: ""  # Classe CSS adicional para personalizar este widget
      forecast_days: 7  # Quantidade de dias da previsão
      keybindings: []  # Atalhos globais opcionais; formato: [{keys: "ctrl+alt+x", action: "toggle_label"}]

  # --- POMODORO WIDGET ---
  # Timer de produtividade com técnica Pomodoro
  pomodoro:
    type: "yasb.pomodoro.PomodoroWidget"
    options:
      # Variáveis: {remaining}, {icon}, {session}, {total_sessions}, {status}
      label: "<span>\uF252</span> {remaining}"
      label_alt: "<span>{icon}</span> {session}/{total_sessions} - {status}"
      work_duration: 25          # Duração do trabalho (minutos)
      break_duration: 5          # Duração da pausa curta (minutos)
      long_break_duration: 15    # Duração da pausa longa (minutos)
      long_break_interval: 4     # Pausa longa a cada N sessões
      auto_start_breaks: true    # Inicia pausas automaticamente
      auto_start_work: true      # Inicia trabalho automaticamente após pausa
      sound_notification: true   # Notificação sonora
      show_notification: true    # Notificação visual do Windows
      hide_on_break: false       # Oculta durante pausas
      session_target: 8          # Meta diária de sessões
      icons:
        work: "\uF252"
        break: "\uF253"
        paused: "\uF254"
      menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "System"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0
        circle_background_color: "#09ffffff"
        circle_work_progress_color: "#88c0d0"
        circle_break_progress_color: "#a3be8c"
        circle_thickness: 8
        circle_size: 160
      callbacks:
        on_left: "toggle_menu"
        on_middle: "reset_timer"
        on_right: "toggle_label"
      class_name: ""  # Classe CSS adicional para personalizar este widget
      progress_bar:  # Aparência e comportamento do indicador de progresso
        enabled: false  # Ativa ou desativa este recurso
        progress_type: "circular"  # Tipo: circular, linear_horizontal ou linear_vertical
        size: 18  # Tamanho em pixels
        thickness: 3  # Espessura em pixels
        radius: 0  # Raio dos cantos em pixels
        color: "#00C800"  # Cor principal; aceita hexadecimal
        background_color: "#3C3C3C"  # Cor de fundo
        position: "left"  # Posição do elemento
        animation: true  # Animação das mudanças do indicador
      keybindings: []  # Atalhos globais opcionais; formato: [{keys: "ctrl+alt+x", action: "toggle_label"}]

  # --- POWER MENU WIDGET ---
  # Menu de opções de energia (desligar, reiniciar, etc) em tela cheia
  power_menu:  # Nome do widget dentro do layout do YASB
    type: "yasb.power_menu.PowerMenuWidget"  # Classe do widget responsável pelo menu de energia
    options:  # Bloco de configurações do widget
      label: "\uF011"  # Ícone exibido no widget (ícone de energia - fonte Nerd/Segoe Fluent)
      uptime: true  # Exibe o tempo que o sistema está ligado no menu
      show_user: true  # Mostra o nome do usuário logado no topo do menu
      blur: true  # Desativa o efeito de desfoque no próprio widget
      blur_background: true  # Ativa desfoque apenas no fundo atrás do menu ao abrir
      animation_duration: 120 # Duração da animação de abertura/fechamento em milissegundos
      button_row: 3 # Quantidade de botões por linha (mínimo 1, máximo 6)

      buttons:  # Definição dos botões que aparecem no menu
        restart: ["\uEAD2", "Restart"]  # Botão Reiniciar (ícone + texto)
        shutdown: ["\uF011", "Shut Down"]  # Botão Desligar
        signout: ["\uDB80\uDF43", "Sign out"]  # Botão Sair da conta (logoff)
        hibernate: ["\uF28E", "Hibernate"]  # Botão Hibernar
        lock: ["\uEA75", "Lock"]  # Botão Bloquear sessão
        cancel: ["\uDB81\uDF3A", "Cancel"]  # Botão Cancelar/fechar o menu
        sleep: null  # Botão de suspensão do computador
        force_shutdown: null  # Botão para forçar o desligamento
        force_restart: null  # Botão para forçar a reinicialização
      menu_style: "fullscreen"  # Estilo do menu de energia
      popup:  # Aparência e posicionamento da janela
        blur: true  # Ativa o efeito de desfoque
        round_corners: true  # Arredonda os cantos da janela
        round_corners_type: "normal"  # Tipo de arredondamento: normal ou small
        border_color: "System"  # Cor da borda: System, None ou uma cor hexadecimal
        alignment: "right"  # Alinhamento horizontal: left, center ou right
        direction: "down"  # Direção de abertura: up ou down
        offset_top: 6  # Deslocamento vertical em pixels
        offset_left: 0  # Deslocamento horizontal em pixels
      profile_image_size: 64  # Tamanho da imagem do perfil em pixels
      callbacks:  # Ações ao clicar com os botões do mouse
        on_left: "toggle_power_menu"  # Clique esquerdo
        on_middle: "do_nothing"  # Clique do meio
        on_right: "do_nothing"  # Clique direito
      keybindings: []  # Atalhos globais opcionais; formato: [{keys: "ctrl+alt+x", action: "toggle_label"}]

  # --- POWER PLAN WIDGET ---
  # Mostra e altera o plano de energia do Windows
  power_plan:
    type: "yasb.power_plan.PowerPlanWidget"
    options:
      # Variáveis: {active_plan}
      label: "<span>\uF0E7</span> {active_plan}"
      label_alt: "<span>\uF0E7</span> Power Plan {active_plan}"
      # A atualização do plano de energia é automática; update_interval foi removido.
      menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "center"
        direction: "down"
        offset_top: 6
        offset_left: 0
      callbacks:
        on_left: "toggle_menu"
        on_middle: "do_nothing"
        on_right: "toggle_label"
      class_name: ""  # Classe CSS adicional para personalizar este widget
      class_map: {}  # Classes CSS associadas aos planos de energia
      keybindings: []  # Atalhos globais opcionais; formato: [{keys: "ctrl+alt+x", action: "toggle_label"}]

# --- QUICK LAUNCH WIDGET ---
  # Launcher de busca rápida com múltiplos provedores (apps, calculadora, clipboard, etc.)
  quick_launch:
    type: "yasb.quick_launch.QuickLaunchWidget"
    options:
      label: "<span>\uF002</span>"              # Ícone de lupa (FontAwesome)
      search_placeholder: "Search applications..."  # Texto de placeholder na barra de busca
      max_results: 100                          # Número máximo de resultados exibidos
      show_icons: true                          # Exibe ícones nos resultados
      icon_size: 25                             # Tamanho dos ícones em pixels
      home_page: true                           # Habilita página inicial com provedores destacados
      compact_mode: false                       # Modo compacto sem descrições (apenas ícones e nomes)
      providers:                                # Provedores de busca disponíveis e seus prefixos de ativação
        apps:
          enabled: true       # Busca aplicativos instalados
          prefix: "*"         # Prefixo para ativar este provedor
          priority: 0         # Ordem de exibição (menor = maior prioridade)
          show_recent: true   # Exibe aplicativos usados recentemente
          max_recent: 5       # Número máximo de itens recentes
          show_description: true  # Exibe descrição do aplicativo
        calculator:
          enabled: true       # Calculadora integrada
          prefix: "="         # Ex: "= 2+2"
          priority: 1
        clipboard_history:
          enabled: true       # Histórico da área de transferência
          prefix: "cb"        # Ex: "cb texto copiado"
          priority: 2
          max_items: 30       # Número máximo de itens no histórico
          show_preview: true  # Exibe uma prévia do resultado selecionado
        currency:
          enabled: true       # Conversor de moedas
          prefix: "$"         # Ex: "$ 100 USD BRL"
          priority: 3
        bookmarks:
          enabled: true       # Favoritos do navegador
          prefix: "*"         # Ex: "* github"
          priority: 4
          browser: "all"      # Navegador: "all", "chrome", "firefox", "edge"
          profile: "Default"  # Perfil do navegador
        web_search:
          enabled: true       # Busca na web
          prefix: "?"         # Ex: "? como instalar python"
          priority: 5
          engine: "google"    # Motor de busca: "google", "bing", "duckduckgo"
          custom_engines: []  # Mecanismos de busca personalizados
          remove_engines: []  # Mecanismos de busca padrão que serão removidos
        system_commands:
          enabled: true       # Comandos do sistema (desligar, reiniciar, etc.)
          prefix: ">"         # Ex: "> restart"
          priority: 6
        settings:
          enabled: true       # Abre páginas de configurações do Windows
          prefix: "@"         # Ex: "@ bluetooth"
          priority: 7
        kill_process:
          enabled: true       # Encerra processos em execução
          prefix: "kk"        # Ex: "kk chrome"
          priority: 8
        port_viewer:
          enabled: true       # Visualiza portas em uso
          prefix: "pv"        # Ex: "pv 8080"
          priority: 9
          tcp_listening_only: true    # Exibe apenas portas em modo LISTEN
          include_established: false  # Inclui conexões já estabelecidas
        file_search:
          enabled: true       # Busca arquivos no sistema
          prefix: "/"         # Ex: "/ relatorio.pdf"
          priority: 10
          backend: "everything" # Motor de busca: "auto", "everything", "windows"
          show_path: true     # Exibe o caminho completo do arquivo
          show_preview: false  # Exibe uma prévia do resultado selecionado
        unit_converter:
          enabled: true       # Conversor de unidades
          prefix: "~"         # Ex: "~ 100 km miles"
          priority: 11
        emoji:
          enabled: true       # Busca e copia emojis
          prefix: ":"         # Ex: ":smile"
          priority: 12
        color:
          enabled: true       # Conversor e seletor de cores
          prefix: "c:"        # Ex: "c: #FF0000"
          priority: 13
        world_clock:
          enabled: true       # Relógio mundial por fuso horário
          prefix: "tz"        # Ex: "tz Tokyo"
          priority: 14
        snippets:
          enabled: true       # Atalhos de texto (snippets)
          prefix: ";"         # Ex: ";email" expande para texto completo
          priority: 15
          type_delay: 200     # Atraso entre caracteres ao digitar o snippet (ms)
        hacker_news:
          enabled: true       # Notícias do Hacker News
          prefix: "hn"        # Ex: "hn"
          priority: 16
          cache_ttl: 300      # Tempo de cache em segundos
          max_items: 30       # Número máximo de notícias exibidas
        dev_tools:
          enabled: true       # Ferramentas para desenvolvedores (encode, decode, hash, etc.)
          prefix: "dev"       # Ex: "dev base64 hello"
          priority: 17
        ip_info:
          enabled: true       # Informações de IP (local e público)
          prefix: "ip"        # Ex: "ip"
          priority: 18
        vscode:
          enabled: true       # Projetos recentes do VS Code
          prefix: "vsc"       # Ex: "vsc meu-projeto"
          priority: 19
          state_storage_path: ""  # Caminho dos dados do editor; vazio usa o VSCode padrão
        binance:  # Provedor opcional de cotações da Binance
          enabled: false  # Ativa ou desativa este recurso
          prefix: "crypto"  # Prefixo usado nas buscas
          priority: 0  # Prioridade do provedor na lista de resultados
          pairs: ["BTC/USDT"]  # Ajuste de pares
          round: 2  # Quantidade de casas para arredondamento
          open_url: false  # Ícone para abrir o endereço
          domain: "api-gcp.binance.com"  # Ajuste de domínio
        github_notifications:  # Provedor de notificações do GitHub
          enabled: false  # Ativa ou desativa este recurso
          prefix: "gh"  # Prefixo usado nas buscas
          priority: 0  # Prioridade do provedor na lista de resultados
          token: "env"  # Token de acesso; configure antes de ativar o provedor
        ssh:  # Provedor de conexões SSH
          enabled: false  # Ativa ou desativa este recurso
          prefix: "ssh"  # Prefixo usado nas buscas
          priority: 0  # Prioridade do provedor na lista de resultados
          ssh_config_path: ""  # Caminho da configuração de conexões SSH
        window_switcher:  # Provedor de alternância entre janelas
          enabled: false  # Ativa ou desativa este recurso
          prefix: "win"  # Prefixo usado nas buscas
          priority: 0  # Prioridade do provedor na lista de resultados
        windows_terminal:  # Provedor de perfis do Windows Terminal
          enabled: false  # Ativa ou desativa este recurso
          prefix: "wt"  # Prefixo usado nas buscas
          priority: 0  # Prioridade do provedor na lista de resultados
        wsl:  # Provedor de distribuições do WSL
          enabled: false  # Ativa ou desativa este recurso
          prefix: "wsl"  # Prefixo usado nas buscas
          priority: 0  # Prioridade do provedor na lista de resultados
          show_online: true  # Exibe os dispositivos conectados
      popup:  # Configurações visuais do popup de busca
        width: 720                      # Largura do popup em pixels
        height: 600                     # Altura do popup em pixels
        blur: true                      # Efeito de desfoque no fundo
        round_corners: true             # Cantos arredondados
        round_corners_type: "normal"    # Tipos: "normal", "small"
        border_color: "system"          # "system", "none", ou cor HEX
        dark_mode: true                 # Força tema escuro no popup
      callbacks:
        on_left: "toggle_quick_launch"  # Abre/fecha o launcher ao clicar
        on_middle: "do_nothing"  # Clique do meio
        on_right: "do_nothing"  # Clique direito
      keybindings:
        - keys: "alt+space"             # Atalho global para abrir o launcher
          action: "toggle_quick_launch"
      remember_last_query: false  # Mantém a última busca ao reabrir o lançador
      compact_text: false  # Usa uma apresentação compacta dos resultados

  # --- RECYCLE BIN WIDGET ---
  # Monitor da lixeira do Windows
  recycle_bin:
    type: "yasb.recycle_bin.RecycleBinWidget"
    options:
      # Variáveis: {icon}, {items_count}, {items_size}
      label: "<span>{icon}</span> . {items_count}"
      label_alt: "Items na lixeira: {items_count}, Tamanho total ({items_size})"
      icons:
        bin_empty: "\uDB82\uDE7A"
        bin_filled: "\uDB82\uDE79"
      callbacks:
        on_left: "toggle_label"
        on_right: "empty_bin"    # Esvazia a lixeira
        on_middle: "open_bin"    # Abre a lixeira
      class_name: ""  # Classe CSS adicional para personalizar este widget
      tooltip: true  # Informação exibida ao passar o mouse
      show_confirmation: false  # Solicita confirmação antes de esvaziar a lixeira
      keybindings: []  # Atalhos globais opcionais; formato: [{keys: "ctrl+alt+x", action: "toggle_label"}]

  # --- SERVER MONITOR WIDGET ---
  # Monitor de status de servidores/sites
  server_monitor:
    type: "yasb.server_monitor.ServerMonitor"
    options:
        # Variáveis: {online}, {offline}, {total}
      label: "<span>\uF510</span>"
      label_alt: "{online}/{offline} of {total}"
      ssl_check: true         # Verifica certificado SSL
      ssl_verify: true        # Valida certificado
      ssl_warning: 10         # Aviso quando expirar em N dias
      timeout: 2              # Timeout da conexão (segundos)
      update_interval: 300    # Verificação a cada N segundos
      desktop_notifications:    # Notificações do Windows
        ssl: true             # Notifica sobre SSL
        offline: true         # Notifica quando offline
      servers:  # Cada servidor agora exige nome e URL
        - {name: "netflix.com", url: "https://netflix.com"}
        - {name: "google.com", url: "https://google.com"}
        - {name: "subdomain.yahoo.com", url: "https://subdomain.yahoo.com"}
      menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "System"
        alignment: "right"
        direction: "down"
        offset_top: 6  # Deslocamento vertical em pixels
        offset_left: 0  # Deslocamento horizontal em pixels
      callbacks:
        on_left: "toggle_menu"
        on_right: "toggle_label"
        on_middle: "do_nothing"  # Clique do meio
      tooltip: true  # Informação exibida ao passar o mouse
      icons:  # Ícones usados pelos estados e controles
        online: "\uf444"  # Ajuste de conectado
        offline: "\uf4c3"  # Ajuste de desconectado
        warning: "\uf4c3"  # Ajuste de aviso
        reload: "\udb81\udc50"  # Ajuste de recarregar
      keybindings: []  # Atalhos globais opcionais; formato: [{keys: "ctrl+alt+x", action: "toggle_label"}]

  # --- SYSTRAY WIDGET ---
  # Bandeja do sistema (system tray) com ícones de aplicativos
  systray:
    type: "yasb.systray.SystrayWidget"
    options:
      class_name: "systray"
      label_collapsed: "▼" # Ícone quando a bandeja está colapsada (pode ser uma seta ou similar)
      label_expanded: "▶" # Ícone quando a bandeja está expandida (pode ser uma seta ou similar)
      label_position: "left" # Posição do botão: "left", "right"
      icon_size: 16
      pin_click_modifier: "alt" # Modificador para clicar e fixar um ícone (ex: "alt", "ctrl", "shift")
      show_in_popup: true # Exibe os ícones em um popup ao invés de diretamente na barra
      icons_per_row: 4 # Quantidade de ícones por linha no popup
      popup:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: None
        alignment: "center"
        direction: "down"
        offset_top: 6
        offset_left: 0
      show_unpinned: true  # Exibe os ícones não fixados
      show_unpinned_button: true  # Exibe o botão de ícones não fixados
      show_battery: false  # Exibe o ícone de bateria do Windows
      show_volume: false  # Exibe o ícone de volume do Windows
      show_network: false  # Exibe o ícone de rede do Windows
      hide_icons: []  # Ícones que devem ser ocultados
      tooltip: true  # Informação exibida ao passar o mouse
      use_hook: false  # Usa o mecanismo de captura de ícones da bandeja

  # --- TASKBAR WIDGET ---
  # Barra de tarefas com janelas abertas
  taskbar:
    type: "yasb.taskbar.TaskbarWidget"
    options:
      icon_size: 20
      tooltip: true
      show_only_visible: false
      strict_filtering: true
      monitor_exclusive: false
      animation:
        enabled: true
        duration: 200  # Duração da animação em milissegundos
      preview:  # Preview da janela ao passar o mouse
        enabled: true
        width: 240          # Largura do preview
        delay: 400          # Delay antes de mostrar (ms)
        padding: 8
        margin: 8
        blur: false  # Ativa o efeito de desfoque
        peek: false  # Destaca a janela apontada ao passar o mouse sobre a prévia
      title_label:  # Label com título da janela
        enabled: false
        show: "always"      # Opções: "always", "hover", "never"
        min_length: 10
        max_length: 30
      callbacks:
        on_middle: close_app
        on_right: context_menu
        on_left: "toggle_window"  # Clique esquerdo
      ignore_apps:  # Aplicativos a ignorar
        processes: []       # Ex: ["explorer.exe"]
        titles: ["keyviz"]          # Ex: ["Discord"]
        classes: []         # Ex: ["ConsoleWindowClass"]
      hide_empty: false  # Oculta o widget quando não há conteúdo
      grouping:  # Agrupamento de janelas do mesmo aplicativo
        enabled: false  # Ativa ou desativa este recurso
        show_count: true  # Exibe a quantidade de janelas no grupo
      keybindings: []  # Atalhos globais opcionais; formato: [{keys: "ctrl+alt+x", action: "toggle_label"}]

  # --- TODO WIDGET ---
  # Lista de tarefas (To-Do List)
  todo:
    type: "yasb.todo.TodoWidget"
    options:
      # Variáveis: {count}, {completed}
      label: "\uF0AE {count}/{completed}"
      label_alt: "\uF0AE Tasks: {count}"
      # data_path: "~/Documents/my-todos.json"  # Caminho customizado
      menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "center"
        direction: "down"
        offset_top: 6
        offset_left: 0
      icons:
        add: "\uF501 New Task"
        edit: "Edit"
        delete: "Delete"
        date: "\uE641"
        category: "\uF412"
        checked: "\uDB80\uDD34"
        unchecked: "\uDB80\uDD30"
        sort: "\uEAB4"
        no_tasks: "\uF4A0"
      categories:  # Categorias personalizadas
        default:
          label: "Geral"
        soon:
          label: "Completar em breve"
        today:
          label: "Fim do dia"
        urgent:
          label: "Urgente"
        important:
          label: "Importante"
      callbacks:
        on_left: "toggle_menu"
        on_middle: "do_nothing"
        on_right: "toggle_label"
      data_path: ""  # Caminho dos dados; vazio usa o local padrão do YASB
      keybindings: []  # Atalhos globais opcionais; formato: [{keys: "ctrl+alt+x", action: "toggle_label"}]


  # --- TRAFFIC WIDGET ---
  # Monitor de tráfego de rede (download/upload)
  traffic:
    type: "yasb.traffic.TrafficWidget"
    options:
      # Variáveis: {download_speed}, {upload_speed}
      label: "\uEB01 \uEAB4 {download_speed} | \uEAB7 {upload_speed}"
      label_alt: "Download {download_speed} | Upload {upload_speed}"
      update_interval: 1000  # Atualização em ms
      menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "left"
        direction: "down"
        offset_top: 6
        offset_left: 0
        show_interface_name: true  # Exibe o nome da interface no menu
        show_internet_info: true  # Exibe as informações da conexão com a internet
      callbacks:
        on_left: "toggle_menu"
        on_right: "toggle_label"
        on_middle: "do_nothing"  # Clique do meio
      class_name: ""  # Classe CSS adicional para personalizar este widget
      interface: "auto"  # Interface de rede; vazio usa a seleção automática
      hide_if_offline: false  # Oculta o widget quando estiver desconectado
      max_label_length: 0  # Largura máxima reservada ao rótulo
      max_label_length_align: "left"  # Alinhamento do rótulo dentro da largura reservada
      speed_unit: "bits"  # Unidade de velocidade: bytes ou bits
      hide_decimal: false  # Oculta as casas decimais
      speed_threshold:  # Limites usados para classificar a velocidade
        min_upload: 1000  # Limite mínimo de upload
        min_download: 1000  # Limite mínimo de download
      keybindings: []  # Atalhos globais opcionais; formato: [{keys: "ctrl+alt+x", action: "toggle_label"}]

  # --- UPDATE CHECK WIDGET ---
  # Verificador de atualizações (Windows Update e Winget)
  update_check:
    type: "yasb.update_check.UpdateCheckWidget"
    options:
      windows_update:  # Atualizações do Windows
        enabled: true
        label: "<span>\uF0AB</span> {count}"
        interval: 240    # Verificação a cada X minutos
        exclude: []      # Lista de updates para excluir da notificação (por nome ou KB ID, ex: "KB5006670" ou "Intel Corporation Driver Update (24.10.0.4)")
        tooltip: true  # Informação exibida ao passar o mouse
      winget_update:   # Atualizações de apps via Winget
        enabled: true
        label: "<span>\uF0AB</span> {count}"
        interval: 60     # Verificação a cada X minutos
        exclude: [Bonjour]      # Lista de pacotes para excluir da notificação (por ID, ex: "Google.Chrome" ou "Mozilla.Firefox")
        tooltip: true  # Informação exibida ao passar o mouse
      scoop_update:  # Verificação opcional de atualizações pelo Scoop
        enabled: false  # Ativa ou desativa este recurso
        label: "{count}"  # Texto principal; aceita as variáveis do widget
        tooltip: true  # Informação exibida ao passar o mouse
        exclude: []  # Ajuste de excluir
        interval: 240  # Intervalo de atualização do recurso

  # --- VOLUME WIDGET ---
  # Controle de volume do sistema e por aplicativo
  volume:
    type: "yasb.volume.VolumeWidget"
    options:
      # Variáveis: {icon}, {level}, {volume}
      label: "<span>{icon}</span> {level}"
      label_alt: "{volume}"
      icons:  # Ícones para cada nível de volume
        - "\uEEE8"  # Mudo
        - "\uF026"  # 0-10%
        - "\uF027"  # 11-30%
        - "\uF027"  # 31-60%
        - "\uF028"  # 61-100%  
      audio_menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "center"
        direction: "down"
        offset_top: 6
        offset_left: 0
        show_apps: true           # Mostra lista de apps com áudio
        show_app_labels: false    # Mostra nomes dos apps
        show_app_icons: true      # Mostra ícones dos apps
        show_apps_expanded: true # Apps expandidos por padrão
        app_icons:  # Ícones do botão de expandir/colapsar
          toggle_down: "\uF078"
          toggle_up: "\uF077"
      callbacks:
        on_left: "toggle_volume_menu"
        on_middle: "toggle_mute"
        on_right: "exec start ms-settings:sound"   # Abre as configurações de som do Windows
      class_name: ""  # Classe CSS adicional para personalizar este widget
      mute_text: "mute"  # Texto exibido quando o som está mudo
      tooltip: true  # Informação exibida ao passar o mouse
      scroll_step: 2  # Quantidade alterada a cada passo da roda do mouse
      invert_wheel: false  # Inverte o sentido da roda do mouse
      slider_beep: true  # Reproduz som ao ajustar o volume
      progress_bar:  # Aparência e comportamento do indicador de progresso
        enabled: false  # Ativa ou desativa este recurso
        progress_type: "circular"  # Tipo: circular, linear_horizontal ou linear_vertical
        size: 18  # Tamanho em pixels
        thickness: 3  # Espessura em pixels
        radius: 0  # Raio dos cantos em pixels
        color: "#00C800"  # Cor principal; aceita hexadecimal
        background_color: "#3C3C3C"  # Cor de fundo
        position: "left"  # Posição do elemento
        animation: true  # Animação das mudanças do indicador
      keybindings: []  # Atalhos globais opcionais; formato: [{keys: "ctrl+alt+x", action: "toggle_label"}]

  # --- VSCODE WIDGET ---
  # Abre pastas e arquivos recentes do Visual Studio Code; requer o editor e seu comando no PATH.
  # Para exibir, adicione "vscode" a uma lista left, center ou right da barra.
  vscode:
    type: "yasb.vscode.VSCodeWidget"
    options:
      label: "<span>\udb82\ude1e</span>"  # Texto principal; aceita as variáveis do widget
      label_alt: "<span>\ue943</span> Recentes"  # Texto alternativo ao alternar o rótulo
      menu_title: "Projetos recentes do VSCode"  # Título exibido no menu
      icons:  # Ícones usados pelos estados e controles
        folder: "\uf114"  # Ícone de pasta
        file: "\uf016"  # Ícone de arquivo
        remote: ""  # Ícone para sessões remotas; vazio oculta o ícone
      truncate_to_root_dir: false  # Exibe somente o nome da pasta raiz do projeto
      max_number_of_folders: 30  # Limite de pastas recentes no menu
      max_number_of_files: 30  # Limite de arquivos recentes no menu; 0 oculta arquivos
      state_storage_path: ""  # Caminho dos dados do editor; vazio usa o VSCode padrão
      modified_date_format: "Modificado: %d/%m/%Y %H:%M"  # Formato da data de modificação exibida no menu
      cli_command: "code"  # Comando usado para abrir os projetos no editor
      menu:  # Aparência e posicionamento do menu
        blur: true  # Ativa o efeito de desfoque
        round_corners: true  # Arredonda os cantos da janela
        round_corners_type: "normal"  # Tipo de arredondamento: normal ou small
        border_color: "System"  # Cor da borda: System, None ou uma cor hexadecimal
        alignment: "right"  # Alinhamento horizontal: left, center ou right
        direction: "down"  # Direção de abertura: up ou down
        offset_top: 6  # Deslocamento vertical em pixels
        offset_left: 0  # Deslocamento horizontal em pixels
      keybindings: []  # Atalhos globais opcionais; formato: [{keys: "ctrl+alt+x", action: "toggle_label"}]
      callbacks:  # Ações ao clicar com os botões do mouse
        on_left: "toggle_menu"  # Clique esquerdo
        on_middle: "do_nothing"  # Clique do meio
        on_right: "toggle_label"  # Clique direito

  # --- WALLPAPERS WIDGET ---
  # Gerenciador de papéis de parede com galeria
  wallpapers:
    type: "yasb.wallpapers.WallpapersWidget"
    options:
      label: "<span>\ue7aa</span>"  # Ícone de imagem compatível com a fonte Segoe usada no CSS
      # Caminhos para pastas com imagens
      # Pode ser string única ou lista de strings
      image_path: "C:\\Users\\{Username}\\Images"  # Repare que é necessario ter barras duplas, então certifique-se de ajustar isso ao inserir seu caminho personalizado!
      change_automatically: false  # Altera automaticamente
      update_interval: 60          # Intervalo de mudança (segundos)
      engine:
        enabled: true  # Habilita animações para a troca de wallpaper
        animation: "circle" # Estilo da animação (circle/slide_top/diamond/split)
      gallery:  # Configurações da galeria de imagens
        # Opção antiga removida da galeria atual: enabled: true
        # Opção antiga removida da galeria atual: blur: true
        image_width: 220
        # Opção antiga removida da galeria atual: image_per_page: 6
        # Opção antiga removida da galeria atual: gallery_columns: 0    # 0 = automático (corresponde a image_per_page)
        # Opção antiga removida da galeria atual: horizontal_position: "center"    # "left", "center", "right"
        # Opção antiga removida da galeria atual: vertical_position: "center"      # "top", "center", "bottom"
        # Opção antiga removida da galeria atual: position_offset: 0    # Espaço mínimo das bordas (px)
        # Opção antiga removida da galeria atual: respect_work_area: true    # Respeita área de trabalho (evita barra)
        # Opção antiga removida da galeria atual: show_buttons: false        # Mostra botões de navegação
        orientation: "portrait"    # "portrait", "landscape", "both"
        # Opção antiga removida da galeria atual: image_spacing: 8
        # Opção antiga removida da galeria atual: lazy_load: true            # Carrega imagens sob demanda
        # Opção antiga removida da galeria atual: lazy_load_fadein: 400      # Animação de fade-in (ms)
        image_corner_radius: 12
        type: "default"  # Tipo de galeria: default, magnified, strip ou slide
        accent_color: "auto"  # Cor de destaque da galeria; auto usa a cor do Windows
      #run_after:  # Comandos a executar após trocar wallpaper
      #  - "wal -s -t -e -q -n -i {image}"  # Exemplo: Pywal
      #  - "cmd.exe /c start /min pwsh ./yasb.ps1"
      callbacks:
        on_left: "toggle_gallery"
        on_middle: "do_nothing"
        on_right: "change_wallpaper"
      tooltip: true  # Informação exibida ao passar o mouse
      run_after: []  # Comandos executados após trocar o papel de parede
      keybindings: []  # Atalhos globais opcionais; formato: [{keys: "ctrl+alt+x", action: "toggle_label"}]

  # --- WEATHER WIDGET ---
  # Previsão do tempo com card detalhado
  weather:
    type: "yasb.weather.WeatherWidget"
    options:
      # Variáveis: {icon}, {temp}, {location}, {min_temp}, {max_temp}, {humidity}
      label: "<span>{icon}</span> {temp}"
      label_alt: "{location}: Min {min_temp}, Max {max_temp}, Humidity {humidity}"
      api_key: "$env:YASB_WEATHER_API_KEY"  # Chave da API WeatherAPI.com
      # Obtenha gratuitamente em: https://www.weatherapi.com/
      update_interval: 600  # Atualização em segundos (mínimo: 600)
      hide_decimal: true    # Oculta casas decimais
      units: "metric"       # Unidades: "metric" (Celsius) ou "imperial" (Fahrenheit)
      location: "$env:YASB_WEATHER_LOCATION"  # Formato: "Cidade", "País Cidade", "País Cidade CEP"
      callbacks:
        on_left: "toggle_card"
        on_middle: "do_nothing"
        on_right: "toggle_label"
      icons:  # Ícones para cada condição climática
        sunnyDay: "\uE30D"
        clearNight: "\uE32B"
        cloudyDay: "\uE312"
        cloudyNight: "\uE311"
        rainyDay: "\uE308"
        rainyNight: "\uE333"
        snowyDay: "\uE30A"
        snowyNight: "\uE335"
        blizzardDay: "\uDB83\uDF36"
        blizzardNight: "\uDB83\uDF36"
        foggyDay: "\uE303"
        foggyNight: "\uE346"
        thunderstormDay: "\uE30F"
        thunderstormNight: "\uE338"
        default: "\uEBAA"
      weather_card:  # Card de previsão detalhada
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "center"
        direction: "down"
        icon_size: 64
        show_hourly_forecast: true  # Previsão horária
        time_format: "24h"          # "12h" ou "24h"
        hourly_point_spacing: 76    # Espaçamento entre pontos
        hourly_icon_size: 32        # Tamanho dos ícones (16, 32 ou 64 recomendado)
        icon_smoothing: true        # Suavização dos ícones
        temp_line_width: 2          # Largura da linha de temperatura (0 = oculta)
        current_line_color: "#8EAEE8"
        current_line_width: 1       # Linha da hora atual (0 = oculta)
        current_line_style: "dot"   # Estilo: "dot", "solid", "dash"
        hourly_gradient:  # Gradiente de fundo
          enabled: true
          top_color: "#8EAEE8"
          bottom_color: "#2A3E68"
        hourly_forecast_buttons:  # Botões de alternância de dados
          enabled: true
          default_view: "temperature"  # "temperature", "rain", "snow"
          temperature_icon: "\uDB81\uDD99"
          rain_icon: "\uDB81\uDD96"
          snow_icon: "\uDB81\uDD98"
        weather_animation:  # Animações de clima
          enabled: true
          snow_overrides_rain: true  # Neve sobrepõe chuva
          temp_line_animation_style: both  # "rain", "snow", "both", "none"
          rain_effect_intensity: 1.0  # 0.01 - 10.0
          snow_effect_intensity: 1.0  # 0.01 - 10.0
          scale_with_chance: true     # Escala com % de precipitação
          enable_debug: false
        offset_top: 6  # Deslocamento vertical em pixels
        offset_left: 0  # Deslocamento horizontal em pixels
      class_name: ""  # Classe CSS adicional para personalizar este widget
      show_alerts: false  # Exibe alertas meteorológicos
      tooltip: true  # Informação exibida ao passar o mouse
      keybindings: []  # Atalhos globais opcionais; formato: [{keys: "ctrl+alt+x", action: "toggle_label"}]

  # --- WHKD WIDGET ---
  # Widget para mostrar atalhos de teclado do Komorebi (WHKD)
  whkd:
    type: "yasb.whkd.WhkdWidget"
    options:
      label: "<span>\uF11C</span>"
      special_keys:  # Mapeamento de teclas especiais
        - key: "win"
          key_replace: "\uE70F"
        - key: "ctrl"
          key_replace: "Ctrl"
        - key: "alt"
          key_replace: "Alt"
        - key: "shift"
          key_replace: "Shift"
        - key: "left"
          key_replace: "\u2190"
        - key: "right"
          key_replace: "\u2192"
        - key: "up"
          key_replace: "\u2191"
        - key: "down"
          key_replace: "\u2193"
      keybindings: []  # Atalhos globais opcionais; formato: [{keys: "ctrl+alt+x", action: "toggle_label"}]
        

  # --- WIFI WIDGET ---
  # Status e controle de conexão WiFi
  wifi:
    type: "yasb.wifi.WifiWidget"
    options:
      # Variáveis: {wifi_icon}, {wifi_name}, {wifi_strength}, {ip_addr}
      label: "<span>{wifi_icon}</span>"
      label_alt: "{wifi_name} {wifi_strength}%"
      update_interval: 5000
      callbacks:
        on_left: "toggle_menu"
        on_middle: "exec cmd.exe /c start ms-settings:network"
        on_right: "toggle_label"
      ethernet_label: "<span>{wifi_icon}</span>"
      ethernet_label_alt: "<span>{wifi_icon}</span>{ip_addr}"
      ethernet_icon: "\uEBA9"
      get_exact_wifi_strength: false  # Requer permissão de localização
      wifi_icons: ["\uDB82\uDD2E", "\uDB82\uDD1F", "\uDB82\uDD22", "\uDB82\uDD25", "\uDB82\uDD28" # Ícone para 75-100% de intensidade
]
      menu_config:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "System"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0
        wifi_icons_secured: ["\uE670", "\uE671", "\uE672", "\uE673"]
        wifi_icons_unsecured: ["\uEC3C", "\uEC3D", "\uEC3E", "\uEC3F"]
      class_name: ""  # Classe CSS adicional para personalizar este widget
      hide_if_ethernet: false  # Oculta o Wi-Fi quando há conexão Ethernet
      keybindings: []  # Atalhos globais opcionais; formato: [{keys: "ctrl+alt+x", action: "toggle_label"}]

  # --- WIN BUTTON WIDGET ---
  # Botão do menu iniciar do Windows
  win_button:
    type: "yasb.custom.CustomWidget"
    options:
      label: "\uE62A"
      label_alt: "\uE62A"
      class_name: "system-widget"
      callbacks:
        on_left: "exec start_menu"  # Abre o menu iniciar
        on_middle: "do_nothing"  # Clique do meio
        on_right: "do_nothing"  # Clique direito
      label_placeholder: "Loading..."  # Texto exibido enquanto os dados são carregados
      label_max_length: null  # Limite de caracteres do rótulo
      tooltip: false  # Informação exibida ao passar o mouse
      tooltip_label: null  # Texto da dica exibida ao passar o mouse
      exec_options:  # Opções de execução do comando personalizado
        run_cmd: null  # Comando que será executado
        run_once: false  # Executa o comando uma única vez
        run_interval: 120000  # Intervalo entre execuções do comando
        return_format: "json"  # Formato dos dados retornados: string ou json
        hide_empty: false  # Oculta o widget quando não há conteúdo
        use_shell: true  # Executa o comando por meio do interpretador do sistema
        encoding: null  # Codificação usada para ler a saída do comando
      keybindings: []  # Atalhos globais opcionais; formato: [{keys: "ctrl+alt+x", action: "toggle_label"}]

  # --- Window Control ---
  # Controle de janelas ativas (Minimizar / Maximizar / Fechar)

  window_controls:
    type: "yasb.window_controls.WindowControlsWidget"  # Tipo do widget de controles da janela ativa
    options:
      show_app_name: true            # Exibe o nome do aplicativo ao lado dos botões
      maximized_only: false         # Mostra mesmo quando a janela NÃO está maximizada
      buttons: ["minimize", "maximize", "close"]    # Botões exibidos (ordem da esquerda para a direita)
      button_labels:                # Ícones utilizados nos botões (Nerd Font / Fluent / MDL2)
        minimize: "\uEA71"         # Ícone do botão minimizar
        maximize: "\uEA71"         # Ícone do botão maximizar
        restore: "\uEA71"          # Ícone do botão restaurar
        close: "\uEA71"            # Ícone do botão fechar
      monitor_exclusive: true       # Exibe apenas se a janela ativa estiver neste monitor
      animation_duration: 120       # Duração da animação ao trocar de janela (ms)
      class_name: ""  # Classe CSS adicional para personalizar este widget
      app_name_position: "right"  # Posição do nome do aplicativo

# --- WINDOW SWITCHER WIDGET ---
# Widget para alternar entre janelas abertas
  window_switcher:
    type: "yasb.window_switcher.WindowSwitcherWidget"
    options:
      label: "<span>\uf2d2</span>"
      icon_size: 48 # Tamanho do ícone das janelas no switcher
      max_visible_apps: 15 # Número máximo de aplicativos visíveis no switcher
      show_title: true
      keybindings:
        - keys: "alt+w"
          action: "toggle_window_switcher"
          screen: "cursor"
      label_alt: ""  # Texto alternativo ao alternar o rótulo
      popup:  # Aparência e posicionamento da janela
        blur: true  # Ativa o efeito de desfoque
        round_corners: true  # Arredonda os cantos da janela
        round_corners_type: "normal"  # Tipo de arredondamento: normal ou small
        border_color: "System"  # Cor da borda: System, None ou uma cor hexadecimal
        dark_mode: true  # Usa o modo escuro no provedor
      callbacks:  # Ações ao clicar com os botões do mouse
        on_left: "toggle_window_switcher"  # Clique esquerdo
        on_middle: "do_nothing"  # Clique do meio
        on_right: "do_nothing"  # Clique direito

  # --- WINDOWS WORKSPACES WIDGET ---
  # Desktops virtuais nativos do Windows
  windows_workspaces:
    type: "yasb.windows_desktops.WorkspaceWidget"
    options:
      label_workspace_btn: "\uDB81\uDC3D"        # Ícone workspace inativo
      label_workspace_active_btn: "\uDB81\uDC3E" # Ícone workspace ativo
      callbacks:  # Ações ao clicar com os botões do mouse
        on_left: "activate_workspace"  # Clique esquerdo
        on_middle: "do_nothing"  # Clique do meio
        on_right: "toggle_context_menu"  # Clique direito
      keybindings: []  # Atalhos globais opcionais; formato: [{keys: "ctrl+alt+x", action: "toggle_label"}]

# ============================================================
# GUIA DE PERSONALIZAÇÃO RÁPIDA
# ============================================================
#
# CALLBACKS DISPONÍVEIS (ações de clique):
# - toggle_label: Alterna entre label e label_alt
# - toggle_menu: Abre/fecha menu do widget
# - do_nothing: Sem ação
# - exec <comando>: Executa comando do sistema
# - Callbacks específicos por widget (ver documentação de cada um)
#
# FORMATAÇÃO DE LABELS:
# - Use <span>ícone</span> para ícones (FontAwesome, Nerd Fonts)
# - Use {variável} para dados dinâmicos
# - Use HTML básico para formatação
#
# POSICIONAMENTO DE MENUS/POPUPS:
# - alignment: "left", "center", "right"
# - direction: "up", "down"
# - offset_top/left: deslocamento em pixels
#
# EFEITOS VISUAIS (Windows 11):
# - blur: true/false
# - round_corners: true/false
# - round_corners_type: "normal", "small"
# - border_color: "System", "None", ou "#RRGGBB"
#
# SOMBRAS:
# - enabled: true/false
# - color: nome da cor ou "#RRGGBB"
# - radius: tamanho do desfoque
# - offset: [x, y] em pixels
#
# CALLBACKS ESPECIAIS:
# - "exec cmd /c <comando>": Executa comando do Windows
# - "exec start <aplicativo>": Abre aplicativo
# - "exec cmd /c start ms-settings:<página>": Abre Configurações
#   Exemplos: ms-settings:bluetooth, ms-settings:network, etc.
#
# ÍCONES:
# - Use sites como nerdfonts.com para encontrar códigos de ícones
# - Formato: \uXXXX para Unicode básico
# - Formato: \udbXX\udcXX para Unicode estendido
# - FontAwesome: \ufXXX
#
# VARIÁVEIS DE SISTEMA:
# - ~ : Pasta do usuário (C:\Users\<nome>)
# - %USERPROFILE% : Pasta do usuário
# - %APPDATA% : Dados de aplicativos
# - {Username} : Nome do usuário atual
#
# VARIÁVEIS DE AMBIENTE (.env):
# - Use variáveis de ambiente para armazenar dados sensíveis como chaves de API, endereços, senhas, etc.
# - Crie um arquivo chamado ".env" na pasta raiz raiz do YASB (.config\yasb\)
# - no arquivo .env, defina as variáveis no formato "VARIAVEL=valor" (sem aspas), uma por linha.
